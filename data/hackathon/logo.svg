<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0d1117"/>
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Circuit grid pattern (subtle) -->
  <g opacity="0.06" stroke="#34D399" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Circuit traces from brain -->
  <g opacity="0.3" stroke="#34D399" stroke-width="1.5" fill="none" filter="url(#glow)">
    <path d="M 400 220 L 280 180 L 240 120 L 180 120"/>
    <path d="M 400 220 L 520 180 L 560 120 L 620 120"/>
    <path d="M 400 220 L 320 260 L 200 280 L 140 280"/>
    <path d="M 400 220 L 480 260 L 600 280 L 660 280"/>
    <path d="M 400 220 L 360 300 L 320 340 L 260 360"/>
    <path d="M 400 220 L 440 300 L 480 340 L 540 360"/>
    <!-- Horizontal traces -->
    <path d="M 140 280 L 80 280"/>
    <path d="M 660 280 L 720 280"/>
    <path d="M 180 120 L 120 80"/>
    <path d="M 620 120 L 680 80"/>
    <path d="M 260 360 L 200 400"/>
    <path d="M 540 360 L 600 400"/>
  </g>

  <!-- Circuit nodes (small dots at endpoints) -->
  <g fill="#34D399" opacity="0.5">
    <circle cx="120" cy="80" r="3"/>
    <circle cx="680" cy="80" r="3"/>
    <circle cx="80" cy="280" r="3"/>
    <circle cx="720" cy="280" r="3"/>
    <circle cx="200" cy="400" r="3"/>
    <circle cx="600" cy="400" r="3"/>
    <circle cx="180" cy="120" r="4"/>
    <circle cx="620" cy="120" r="4"/>
    <circle cx="140" cy="280" r="4"/>
    <circle cx="660" cy="280" r="4"/>
    <circle cx="260" cy="360" r="4"/>
    <circle cx="540" cy="360" r="4"/>
  </g>

  <!-- Brain glow -->
  <circle cx="400" cy="220" r="120" fill="url(#brainGlow)"/>

  <!-- AI Brain icon (geometric/hexagonal) -->
  <g transform="translate(400, 220)" filter="url(#softGlow)">
    <!-- Outer hexagon -->
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="#34D399" stroke-width="2" opacity="0.6"/>
    <!-- Inner hexagon -->
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.4"/>
    <!-- Brain center - circuit paths -->
    <g stroke="#34D399" stroke-width="1.5" fill="none">
      <!-- Neural connections -->
      <circle cx="0" cy="0" r="8" fill="#34D399" opacity="0.8"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#34D399" opacity="0.3"/>
      <!-- Radial nodes -->
      <circle cx="0" cy="-28" r="4" fill="#34D399" opacity="0.7"/>
      <circle cx="24" cy="-14" r="4" fill="#34D399" opacity="0.7"/>
      <circle cx="24" cy="14" r="4" fill="#34D399" opacity="0.7"/>
      <circle cx="0" cy="28" r="4" fill="#34D399" opacity="0.7"/>
      <circle cx="-24" cy="14" r="4" fill="#34D399" opacity="0.7"/>
      <circle cx="-24" cy="-14" r="4" fill="#34D399" opacity="0.7"/>
      <!-- Connecting lines -->
      <line x1="0" y1="0" x2="0" y2="-28"/>
      <line x1="0" y1="0" x2="24" y2="-14"/>
      <line x1="0" y1="0" x2="24" y2="14"/>
      <line x1="0" y1="0" x2="0" y2="28"/>
      <line x1="0" y1="0" x2="-24" y2="14"/>
      <line x1="0" y1="0" x2="-24" y2="-14"/>
      <!-- Cross connections -->
      <line x1="0" y1="-28" x2="24" y2="-14" opacity="0.5"/>
      <line x1="24" y1="-14" x2="24" y2="14" opacity="0.5"/>
      <line x1="24" y1="14" x2="0" y2="28" opacity="0.5"/>
      <line x1="0" y1="28" x2="-24" y2="14" opacity="0.5"/>
      <line x1="-24" y1="14" x2="-24" y2="-14" opacity="0.5"/>
      <line x1="-24" y1="-14" x2="0" y2="-28" opacity="0.5"/>
    </g>
  </g>

  <!-- Horizontal accent lines -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- TVS Text -->
  <text x="400" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#c9d1d9" letter-spacing="16" filter="url(#glow)">TVS</text>

  <!-- TRINNITY VISERON SYSTEM -->
  <text x="400" y="470" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#34D399" letter-spacing="8" opacity="0.9">TRINNITY VISERON SYSTEM</text>

  <!-- Subtle tagline -->
  <text x="400" y="510" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#c9d1d9" opacity="0.35" letter-spacing="3">MULTI-AGENT AI OPERATING SYSTEM</text>

  <!-- Bottom accent line -->
  <line x1="300" y1="530" x2="500" y2="530" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.3"/>

  <!-- Corner accents -->
  <g stroke="#34D399" stroke-width="1" opacity="0.15">
    <line x1="30" y1="30" x2="80" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="80"/>
    <line x1="770" y1="30" x2="720" y2="30"/>
    <line x1="770" y1="30" x2="770" y2="80"/>
    <line x1="30" y1="570" x2="80" y2="570"/>
    <line x1="30" y1="570" x2="30" y2="520"/>
    <line x1="770" y1="570" x2="720" y2="570"/>
    <line x1="770" y1="570" x2="770" y2="520"/>
  </g>
</svg>
