name: TVS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Core tests
        run: npx tsx tests/core.test.ts
      - name: Web tests
        run: npx tsx tests/web.test.ts || true
      - name: Omega tests
        run: npx tsx tests/omega.test.ts || true
