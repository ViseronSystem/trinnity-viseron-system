<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS — Curso de Inglés · 120 Módulos</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04040f;--panel:rgba(10,12,30,.95);--line:rgba(0,240,255,.16);--cyan:#00f0ff;--purple:#bf5af2;--orange:#ff9f0a;--green:#00ff87;--red:#ff5f57;--text:#e8e8f4;--muted:#9aa0b5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
canvas#estrellas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
header h1{font-family:'Orbitron';font-weight:900;font-size:1.25rem;color:var(--cyan)}
header .sub{color:var(--muted);font-size:.72rem}
.btn-regreso{background:rgba(0,240,255,.08);border:1px solid var(--line);color:var(--cyan);border-radius:99px;padding:8px 16px;font-size:.72rem;font-weight:800;cursor:pointer;text-decoration:none}
.prog{background:rgba(255,255,255,.07);border-radius:99px;height:10px;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:.5s}
.nivel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.nivel .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.nivel h2{font-family:'Orbitron';font-size:1rem;color:var(--purple)}
.nivel .pct{color:var(--green);font-weight:800;font-size:.8rem}
.modulos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mod{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.74rem;transition:.2s;text-align:left}
.mod:hover{border-color:var(--cyan);transform:translateY(-2px)}
.mod.hecho{border-color:rgba(0,255,135,.5);background:rgba(0,255,135,.06)}
.mod .n{font-family:'Orbitron';font-size:.6rem;color:var(--orange)}
.mod .t{color:var(--text);margin-top:3px;line-height:1.35}
.leccion .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.leccion h3{color:var(--cyan);font-size:1.05rem;margin-bottom:8px}
.explicacion{color:var(--text);font-size:.9rem;line-height:1.7}
.ejemplo{display:flex;justify-content:space-between;gap:12px;align-items:center;background:rgba(0,240,255,.05);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;flex-wrap:wrap}
.ejemplo .en{color:var(--cyan);font-weight:700;font-size:.9rem}
.ejemplo .es{color:var(--muted);font-size:.8rem}
.ejemplo button{background:rgba(0,240,255,.12);border:1px solid var(--line);color:var(--cyan);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.85rem}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.vocab .v{display:flex;justify-content:space-between;align-items:center;background:rgba(191,90,242,.07);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.82rem}
.vocab .v b{color:var(--purple)}
.vocab .v span{color:var(--muted);font-size:.76rem}
.vocab .v button{background:none;border:none;color:var(--cyan);cursor:pointer;font-size:.95rem}
.quiz .q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.quiz .q p{font-size:.86rem;margin-bottom:10px;font-weight:700}
.quiz .opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer;font-size:.82rem}
.quiz .opt.bien{background:rgba(0,255,135,.15);border-color:var(--green)}
.quiz .opt.mal{background:rgba(255,95,87,.15);border-color:var(--red)}
.pronuncia{background:linear-gradient(160deg,rgba(10,20,34,.95),rgba(16,8,36,.95));border:1px solid var(--orange);border-radius:16px;padding:20px;margin:14px 0}
.pronuncia h4{color:var(--orange);margin-bottom:8px;font-family:'Orbitron';font-size:.85rem}
.pronuncia .frase{font-size:1.15rem;color:var(--text);font-weight:800;margin:10px 0}
.pronuncia button{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#030310;border:none;border-radius:10px;padding:12px 22px;font-weight:900;cursor:pointer;margin-right:8px}
.pronuncia .result{font-size:.8rem;color:var(--muted);margin-top:10px;min-height:20px}
.boton-fin{background:linear-gradient(90deg,var(--cyan),var(--green));color:#030310;border:none;border-radius:12px;padding:14px 26px;font-weight:900;font-size:.95rem;cursor:pointer;width:100%;margin-top:16px}
.certificado{background:linear-gradient(160deg,rgba(8,26,20,.95),rgba(20,10,40,.95));border:2px solid var(--green);border-radius:20px;padding:34px;text-align:center}
.certificado .titulo{font-family:'Orbitron';font-size:1.4rem;color:var(--green);margin-bottom:10px}
.plan7{background:var(--panel);border:1px solid var(--orange);border-radius:16px;padding:18px;margin-bottom:20px}
.plan7 h3{color:var(--orange);font-size:.95rem;margin-bottom:10px}
.plan7 ol{margin-left:18px;font-size:.8rem;color:var(--muted);line-height:1.9}
.streak{color:var(--orange);font-weight:900;font-size:.85rem}
</style>
</head>
<body>
<canvas id="estrellas"></canvas>
<div class="wrap" id="app"></div>
<script>
/* ===== MOTOR DEL CURSO ===== */
var PROG = { get:function(){ try{return JSON.parse(localStorage.getItem('tvs_atlas')||'{"hechas":[],"nombre":"","streak":0,"ultimo":""}')}catch(e){return {hechas:[],nombre:"",streak:0,ultimo:""}} }, set:function(p){localStorage.setItem('tvs_atlas',JSON.stringify(p))} };
function hablar(texto){ if(!window.speechSynthesis)return; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(texto); u.lang='en-US'; u.rate=0.92; speechSynthesis.speak(u); }
function escuchar(cb){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ cb({err:'sin-soporte'}); return; }
  var r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  r.onresult=function(e){ cb({texto:e.results[0][0].transcript}); };
  r.onerror=function(e){ cb({err:e.error}); };
  r.start();
}
function nivelDe(i){ return Math.floor(i/30); }
function pintarInicio(){
  var p = PROG.get();
  var total = LECCIONES.length, hechas = p.hechas.length;
  var h = '<header><span style="font-size:1.8rem">&#127891;</span><div><h1>ATLAS · CURSO DE INGLÉS</h1><div class="sub">120 módulos reales · A1 → C1 · voz en cada lección · '+(p.nombre?('Alumno: <b style="color:#ff9f0a">'+p.nombre+'</b>'):'')+'</div></div>'+
    '<a class="btn-regreso" href="/">&#8592; TVS</a></header>';
  h += '<div class="prog"><div style="width:'+(hechas/total*100)+'%"></div></div>';
  h += '<div style="text-align:center;font-size:.85rem;color:var(--muted)">Progreso: <b style="color:#00f0ff">'+hechas+'/120 módulos</b> · Racha: <b class="streak">&#128293; '+p.streak+' días</b></div>';
  if (hechas >= total) {
    h += '<div class="certificado" style="margin-top:20px"><div class="titulo">&#127891; CERTIFICADO ATLAS</div><p style="font-size:1rem;color:var(--text)">'+ (p.nombre||'Comandante') +' ha completado los 120 módulos del curso de inglés TVS.</p><p style="color:var(--muted);font-size:.8rem;margin-top:10px">Nivel alcanzado: C1 · Avanzado · Firma: ATLAS · TVS v7.0.0</p></div>';
  }
  h += '<div class="plan7"><h3>PLAN DE 7 DÍAS — ARRANQUE RÁPIDO</h3><ol><li>Módulos 1-5: saludos y presentaciones</li><li>Módulos 6-10: números y tiempo</li><li>Módulos 11-15: comida y compras</li><li>Módulos 16-20: viajes y direcciones</li><li>Módulos 21-25: trabajo y profesiones</li><li>Módulos 26-30: repaso A1 + quiz final</li><li>Día 7: certificado nivel A1</li></ol></div>';
  NIVELES.forEach(function(niv, idx){
    var mods = LECCIONES.filter(function(l){ return l.nivel===idx; });
    var hc = mods.filter(function(l){ return p.hechas.indexOf(l.id)>=0; }).length;
    h += '<div class="nivel"><div class="head"><h2>'+niv.nombre+' — '+niv.desc+'</h2><div class="pct">'+hc+'/'+mods.length+'</div></div><div class="modulos">';
    mods.forEach(function(l){
      var done = p.hechas.indexOf(l.id)>=0;
      h += '<div class="mod'+(done?' hecho':'')+'" onclick="abrirLeccion(\''+l.id+'\')"><div class="n">M'+(l.num+1)+'</div><div class="t">'+l.titulo+'</div></div>';
    });
    h += '</div></div>';
  });
  document.getElementById('app').innerHTML = h;
}
function abrirLeccion(id){
  var l = LECCIONES.find(function(x){return x.id===id});
  if(!l)return;
  var p = PROG.get();
  var h = '<header><a class="btn-regreso" onclick="pintarInicio()">&#8592; Curso</a><div><h1>M'+(l.num+1)+' · '+l.titulo+'</h1><div class="sub">'+NIVELES[l.nivel].nombre+'</div></div><span style="font-size:1.6rem">&#127891;</span></header>';
  h += '<div class="leccion"><div class="card"><h3>&#128218; Explicación</h3><p class="explicacion">'+l.explicacion+'</p></div>';
  h += '<div class="card"><h3>&#128172; Ejemplos</h3>';
  l.ejemplos.forEach(function(e, i){
    h += '<div class="ejemplo"><div><div class="en">'+e.en+'</div><div class="es">'+e.es+'</div></div><button onclick="hablar(\''+e.en.replace(/'/g,"\\'")+'\')">&#128266;</button></div>';
  });
  h += '</div><div class="card"><h3>&#128218; Vocabulario</h3><div class="vocab">';
  l.vocab.forEach(function(v){
    var partes = v.split(':');
    h += '<div class="v"><div><b>'+partes[0]+'</b> <span>'+partes[1]+'</span></div><button onclick="hablar(\''+partes[0].replace(/'/g,"\\'")+'\')">&#128266;</button></div>';
  });
  h += '</div></div>';
  h += '<div class="quiz" id="quiz">';
  l.preguntas.forEach(function(q, qi){
    h += '<div class="q" id="q'+qi+'"><p>'+(qi+1)+'. '+q.p+'</p>';
    q.o.forEach(function(opt, oi){
      h += '<button class="opt" onclick="responder(\''+l.id+'\','+qi+','+oi+')">'+opt+'</button>';
    });
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="pronuncia"><h4>&#127908; PRONUNCIACIÓN — repite en voz alta</h4><div class="frase">"'+l.pronunciacion+'"</div>'+
    '<button onclick="hablar(\''+l.pronunciacion.replace(/'/g,"\\'")+'\')">&#128266; Escuchar</button>'+
    '<button onclick="practicarPronuncia(\''+l.id+'\')">&#127897; Grabar y comparar</button>'+
    '<div class="result" id="pres">Di la frase en inglés. El sistema la escucha y la compara.</div></div>';
  h += '<button class="boton-fin" id="btnTerminar" onclick="terminar(\''+l.id+'\')">&#9989; TERMINAR MÓDULO</button></div>';
  document.getElementById('app').innerHTML = h;
  if (p.hechas.indexOf(l.id)>=0) {
    var bt = document.getElementById('btnTerminar');
    if(bt){bt.textContent='&#10003; MÓDULO COMPLETADO';bt.style.opacity=.6;}
  }
}
function responder(id, qi, oi){
  var l = LECCIONES.find(function(x){return x.id===id});
  var q = l.preguntas[qi];
  var qel = document.getElementById('q'+qi);
  if(!qel)return;
  var opts = qel.querySelectorAll('.opt');
  if(opts[0].classList.contains('bien')||opts[0].classList.contains('mal'))return;
  opts.forEach(function(o, i){
    o.disabled = true;
    if(i===q.c){o.classList.add('bien');}
    else if(i===oi){o.classList.add('mal');}
  });
  var ok = oi===q.c;
  var p = PROG.get();
  p.respuestas = p.respuestas||{};
  if(ok){ var antes=p.respuestas[id]||0; p.respuestas[id]=antes+1; PROG.set(p); }
}
function practicarPronuncia(id){
  var l = LECCIONES.find(function(x){return x.id===id});
  var el = document.getElementById('pres');
  if(!el)return;
  el.textContent = 'Escuchando... habla ahora';
  escuchar(function(res){
    if(!el)return;
    if(res.err){ el.textContent = 'Tu navegador no tiene reconocimiento de voz (usa Chrome/Edge). Sigue practicando con el botón de escuchar.'; return; }
    var dicho = (res.texto||'').toLowerCase().replace(/[^a-z ]/g,'').trim();
    var meta = l.pronunciacion.toLowerCase().replace(/[^a-z ]/g,'').trim();
    var palabras = meta.split(' '), aciertos = 0;
    palabras.forEach(function(w){ if(dicho.indexOf(w)>=0)aciertos++; });
    var pct = Math.round(aciertos/palabras.length*100);
    el.innerHTML = 'Has dicho: <b style="color:#00f0ff">"'+res.texto+'"</b><br>Precisión: <b style="color:'+(pct>=70?'#00ff87':'#ff9f0a')+'">'+pct+'%</b> '+(pct>=70?'&#128293; ¡Excelente!':'Sigue practicando.') ;
  });
}
function terminar(id){
  var p = PROG.get();
  if(p.hechas.indexOf(id)>=0){ pintarInicio(); return; }
  p.hechas.push(id);
  var hoy = new Date().toISOString().slice(0,10);
  if(p.ultimo === hoy){ } else { var ayer = new Date(Date.now()-86400000).toISOString().slice(0,10); p.streak = (p.ultimo===ayer)? (p.streak+1) : 1; }
  p.ultimo = hoy;
  PROG.set(p);
  if(!p.nombre){
    var n = prompt('¡Bien hecho! Escribe tu nombre para el certificado:');
    if(n){ p.nombre = n; PROG.set(p); }
  }
  pintarInicio();
  window.scrollTo(0,0);
}
/* ===== STARFIELD ===== */
(function(){
  var c=document.getElementById('estrellas'),x=c.getContext('2d'),W,H,st=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;st=[];for(var i=0;i<220;i++)st.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1+0.2});}
  rs();addEventListener('resize',rs);
  (function loop(){x.clearRect(0,0,W,H);for(var i=0;i<st.length;i++){var s=st[i];s.z-=0.0015;if(s.z<=0.1){s.z=1;s.x=Math.random()*W;s.y=Math.random()*H;}var px=(s.x-W/2)/s.z+W/2,py=(s.y-H/2)/s.z+H/2;if(px<0||px>W||py<0||py>H)continue;x.globalAlpha=Math.min(1,(1-s.z)*1.3);x.fillStyle='#cfe8ff';x.beginPath();x.arc(px,py,0.8/s.z,0,6.29);x.fill();}x.globalAlpha=1;requestAnimationFrame(loop);})();
})();
var NIVELES = [
 {nombre:'A1 · Principiante', desc:'Fundamentos para sobrevivir en inglés'},
 {nombre:'A2 · Básico', desc:'Conversaciones cotidianas con confianza'},
 {nombre:'B1 · Intermedio', desc:'Trabajo, viajes y opiniones'},
 {nombre:'B2 · Intermedio Alto', desc:'Negocios y comunicación fluida'},
 {nombre:'C1 · Avanzado', desc:'Inglés profesional y matices'}
];
</script>

<script>
var LECCIONES = [
{id:'m0',num:0,nivel:0,titulo:'Saludos básicos',explicacion:'En inglés saludamos con "Hello" o "Hi" a cualquier hora. Para despedirnos usamos "Goodbye" o "Bye". Es el primer paso para comunicarte.',ejemplos:[{en:'Hello, how are you?',es:'Hola, ¿cómo estás?'},{en:'I am fine, thank you.',es:'Estoy bien, gracias.'}],vocab:['hello:hola','goodbye:adiós','please:por favor','thanks:gracias'],preguntas:[{p:'¿Cómo se dice "hola" en inglés?',o:['Hello','Apple','House'],c:0},{p:'¿Cómo se dice "adiós"?',o:['Goodbye','Morning','Water'],c:0}],pronunciacion:'Hello, how are you?'},
{id:'m1',num:1,nivel:0,titulo:'Presentarse',explicacion:'Para decir tu nombre usas "My name is...". Para preguntar el nombre de otro usas "What is your name?".',ejemplos:[{en:'My name is Pedro.',es:'Mi nombre es Pedro.'},{en:'What is your name?',es:'¿Cuál es tu nombre?'}],vocab:['name:nombre','my:mi','your:tu','what:qué'],preguntas:[{p:'"Mi nombre es..." en inglés:',o:['My name is...','I am name','Me name'],c:0},{p:'¿Cómo preguntas el nombre?',o:['What is your name?','Who is your name?','How name you?'],c:0}],pronunciacion:'My name is Pedro.'},
{id:'m2',num:2,nivel:0,titulo:'¿De dónde eres?',explicacion:'Para preguntar el origen usamos "Where are you from?". Se responde "I am from Spain" o el país que sea.',ejemplos:[{en:'Where are you from?',es:'¿De dónde eres?'},{en:'I am from Portugal.',es:'Soy de Portugal.'}],vocab:['where:dónde','from:de','Spain:España','country:país'],preguntas:[{p:'"¿De dónde eres?" en inglés:',o:['Where are you from?','When are you?','What from you?'],c:0},{p:'"Soy de Portugal":',o:['I am from Portugal','I is Portugal','Me Portugal'],c:0}],pronunciacion:'I am from Portugal.'},
{id:'m3',num:3,nivel:0,titulo:'Los números 1-10',explicacion:'Los números son la base de todo: precios, horas y cantidades. Memorízalos en orden: one, two, three...',ejemplos:[{en:'I have two cars.',es:'Tengo dos coches.'},{en:'She is seven years old.',es:'Ella tiene siete años.'}],vocab:['one:uno','two:dos','three:tres','ten:diez'],preguntas:[{p:'¿Qué número es "three"?',o:['3','4','5'],c:0},{p:'"two" es:',o:['2','1','8'],c:0}],pronunciacion:'One, two, three, four, five.'},
{id:'m4',num:4,nivel:0,titulo:'Días de la semana',explicacion:'Los días en inglés: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Siempre con mayúscula.',ejemplos:[{en:'Today is Monday.',es:'Hoy es lunes.'},{en:'I work from Monday to Friday.',es:'Trabajo de lunes a viernes.'}],vocab:['Monday:lunes','Friday:viernes','week:semana','today:hoy'],preguntas:[{p:'"Monday" es:',o:['Lunes','Martes','Domingo'],c:0},{p:'"Viernes" en inglés:',o:['Friday','Sunday','Monday'],c:0}],pronunciacion:'Today is Monday.'},
{id:'m5',num:5,nivel:0,titulo:'El verbo To Be',explicacion:'El verbo más importante: "to be" (ser/estar). En presente: I am, you are, he/she/it is, we are, they are.',ejemplos:[{en:'I am happy.',es:'Estoy feliz.'},{en:'They are students.',es:'Ellos son estudiantes.'}],vocab:['am:soy/estoy','is:es/está','are:son/están','happy:feliz'],preguntas:[{p:'"I ___ happy":',o:['am','is','are'],c:0},{p:'"They ___ students":',o:['are','am','is'],c:0}],pronunciacion:'I am happy.'},
{id:'m6',num:6,nivel:0,titulo:'Colores',explicacion:'Colores básicos: red, blue, green, yellow, black, white. Se usan como adjetivo antes del sustantivo.',ejemplos:[{en:'The car is red.',es:'El coche es rojo.'},{en:'I like blue shoes.',es:'Me gustan los zapatos azules.'}],vocab:['red:rojo','blue:azul','green:verde','yellow:amarillo'],preguntas:[{p:'"Azul" en inglés:',o:['Blue','Red','Green'],c:0},{p:'"The car is ___" (rojo):',o:['red','blue','green'],c:0}],pronunciacion:'The car is red.'},
{id:'m7',num:7,nivel:0,titulo:'La familia',explicacion:'Familia: mother, father, brother, sister. Con "my" indicamos posesión: my brother = mi hermano.',ejemplos:[{en:'My mother is a doctor.',es:'Mi madre es doctora.'},{en:'I have one sister.',es:'Tengo una hermana.'}],vocab:['mother:madre','father:padre','brother:hermano','sister:hermana'],preguntas:[{p:'"Madre" en inglés:',o:['Mother','Father','Sister'],c:0},{p:'"My ___ is a doctor" (madre):',o:['mother','brother','father'],c:0}],pronunciacion:'My mother is a doctor.'},
{id:'m8',num:8,nivel:0,titulo:'Profesiones',explicacion:'Para hablar de trabajo: "I am a teacher". Con "a/an" antes de la profesión: a doctor, an engineer.',ejemplos:[{en:'I am a teacher.',es:'Soy profesor.'},{en:'He is an engineer.',es:'Él es ingeniero.'}],vocab:['teacher:profesor','doctor:médico','engineer:ingeniero','work:trabajo'],preguntas:[{p:'"Soy profesor":',o:['I am a teacher','I am teacher','I teacher'],c:0},{p:'"Él es ingeniero":',o:['He is an engineer','He is engineer','He an engineer'],c:0}],pronunciacion:'I am a teacher.'},
{id:'m9',num:9,nivel:0,titulo:'Comida básica',explicacion:'Palabras de comida: water, bread, milk, apple. Para pedir: "I want..." o "Can I have...?".',ejemplos:[{en:'I want water, please.',es:'Quiero agua, por favor.'},{en:'Can I have an apple?',es:'¿Me das una manzana?'}],vocab:['water:agua','bread:pan','milk:leche','apple:manzana'],preguntas:[{p:'"Agua" en inglés:',o:['Water','Bread','Milk'],c:0},{p:'"Quiero agua, por favor":',o:['I want water, please','I water want','Want I water'],c:0}],pronunciacion:'I want water, please.'},
