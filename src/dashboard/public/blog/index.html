<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Trinnity Viseron System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --neon: #00f0ff; --neon2: #bf5af2; --bg: #050510; --card: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.06); --text: #e4e4f0; --text2: rgba(228,228,240,0.5); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
    .cyber-card { background:var(--card); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:12px; transition:all 0.4s; }
    .cyber-card:hover { border-color:rgba(0,240,255,0.2); transform:translateY(-4px); box-shadow:0 20px 60px rgba(0,0,0,0.6); }
    .text-neon { color:var(--neon); }
    .text-neon2 { color:var(--neon2); }
    .badge-neon { background:rgba(0,240,255,0.1); color:var(--neon); border:1px solid rgba(0,240,255,0.15); display:inline-block; padding:2px 10px; border-radius:100px; font-size:11px; }
    .badge-purple { background:rgba(191,90,242,0.1); color:var(--neon2); border:1px solid rgba(191,90,242,0.15); display:inline-block; padding:2px 10px; border-radius:100px; font-size:11px; }
    .scanline { position:fixed; inset:0; z-index:9999; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px); }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--neon); border-radius:2px; }
    .grid-overlay { background-image:linear-gradient(rgba(0,240,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.03) 1px,transparent 1px); background-size:40px 40px; }
  </style>
</head>
<body class="grid-overlay">
<div class="scanline"></div>

<nav class="border-b border-white/5" style="background:rgba(5,5,16,0.9);backdrop-filter:blur(20px);">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="text-lg font-bold tracking-tight font-['Space_Grotesk']">
      <span class="text-neon">Trinnity</span><span class="text-white/40"> Viseron</span> <span class="text-xs text-white/20 font-normal">Blog</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="/" class="text-white/40 hover:text-neon transition-colors">Início</a>
      <a href="/dashboard" class="text-white/40 hover:text-neon2 transition-colors">Dashboard</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-6 py-16">
  <div class="text-center mb-16">
    <span class="text-neon text-xs font-semibold tracking-[0.2em] uppercase">// Blog</span>
    <h1 class="text-4xl md:text-5xl font-bold mt-4 font-['Space_Grotesk']">Trinnity Viseron <span class="text-neon">Insights</span></h1>
    <p class="text-white/40 mt-4 max-w-xl mx-auto">Artigos gerados automaticamente pelo sistema multi-agente Trinnity Viseron</p>
  </div>

  <div id="posts-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="col-span-full text-center text-white/20 py-20">
      <div class="animate-pulse">Carregando posts...</div>
    </div>
  </div>
</main>

<footer class="border-t border-white/5 py-8 px-6">
  <div class="max-w-6xl mx-auto text-center text-xs text-white/20">
    <p>&copy; 2026 — Autoria de <span class="text-white/40">Trinnity &amp; Viseron</span></p>
  </div>
</footer>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="/voice-widget.js"></script>
<script>
async function loadPosts() {
  const container = document.getElementById('posts-container');
  try {
    const res = await fetch('/api/blog/posts');
    const posts = await res.json();
    if (posts.length === 0) {
      container.innerHTML = '<div class="col-span-full text-center text-white/20 py-20"><p class="text-6xl mb-4">📝</p><p>Nenhum post publicado ainda.</p><p class="text-sm mt-2">Os agentes Viseron estão gerando conteúdo...</p></div>';
      return;
    }
    container.innerHTML = posts.map(post => `
      <a href="/blog/post.html?slug=${post.slug}" class="cyber-card p-6 block no-underline text-inherit group">
        <div class="flex flex-wrap gap-2 mb-3">
          ${post.tags.map(t => `<span class="badge-neon">${t}</span>`).join('')}
        </div>
        <h2 class="text-lg font-semibold font-['Space_Grotesk'] group-hover:text-neon transition-colors mb-2">${post.title}</h2>
        <p class="text-sm text-white/40 mb-4 line-clamp-3">${post.excerpt}</p>
        <div class="flex items-center justify-between text-xs text-white/20">
          <span>${post.author}</span>
          <span>${new Date(post.publishedAt || post.createdAt).toLocaleDateString('pt-BR', {day:'numeric',month:'short',year:'numeric'})}</span>
        </div>
      </a>
    `).join('');
  } catch (err) {
    container.innerHTML = '<div class="col-span-full text-center text-white/20 py-20"><p>Erro ao carregar posts.</p></div>';
  }
}

document.addEventListener('DOMContentLoaded', loadPosts);
</script>
</body>
</html>
