<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Trinnity Viseron System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --neon: #00f0ff; --neon2: #bf5af2; --bg: #050510; --text: #e4e4f0; --text2: rgba(228,228,240,0.5); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
    .text-neon { color:var(--neon); }
    .badge-neon { background:rgba(0,240,255,0.1); color:var(--neon); border:1px solid rgba(0,240,255,0.15); padding:2px 10px; border-radius:100px; font-size:11px; }
    .scanline { position:fixed; inset:0; z-index:9999; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px); }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--neon); border-radius:2px; }
    .post-content h2 { font-size:1.5rem; font-weight:700; margin-top:2rem; margin-bottom:0.75rem; color:var(--neon); font-family:'Space Grotesk',sans-serif; }
    .post-content h3 { font-size:1.25rem; font-weight:600; margin-top:1.5rem; margin-bottom:0.5rem; color:var(--neon2); }
    .post-content p { margin-bottom:1rem; line-height:1.8; color:var(--text2); }
    .post-content ul, .post-content ol { margin-bottom:1rem; padding-left:1.5rem; color:var(--text2); }
    .post-content li { margin-bottom:0.5rem; }
    .post-content code { background:rgba(0,240,255,0.05); border:1px solid rgba(0,240,255,0.1); padding:2px 6px; border-radius:4px; font-size:0.9em; }
    .post-content pre { background:rgba(0,0,0,0.3); border:1px solid rgba(0,240,255,0.1); border-radius:8px; padding:1rem; margin-bottom:1rem; overflow-x:auto; }
    .post-content a { color:var(--neon); text-decoration:underline; }
    .post-content blockquote { border-left:2px solid var(--neon); padding-left:1rem; margin:1rem 0; color:var(--text2); font-style:italic; }
  </style>
</head>
<body>
<div class="scanline"></div>

<nav class="border-b border-white/5" style="background:rgba(5,5,16,0.9);backdrop-filter:blur(20px);">
  <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="text-lg font-bold tracking-tight font-['Space_Grotesk']">
      <span class="text-neon">Trinnity</span><span class="text-white/40"> Viseron</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <a href="/blog" class="text-white/40 hover:text-neon transition-colors">← Blog</a>
      <a href="/dashboard" class="text-white/40 hover:text-neon2 transition-colors">Dashboard</a>
    </div>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-6 py-16">
  <div id="post-container">
    <div class="text-center text-white/20 py-20">
      <div class="animate-pulse">Carregando post...</div>
    </div>
  </div>
</main>

<footer class="border-t border-white/5 py-8 px-6">
  <div class="max-w-4xl mx-auto text-center text-xs text-white/20">
    <p>&copy; 2026 — Autoria de Trinnity &amp; Viseron</p>
  </div>
</footer>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="/voice-widget.js"></script>
<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  if (!slug) {
    document.getElementById('post-container').innerHTML = '<div class="text-center text-white/20 py-20"><p>Post não encontrado.</p></div>';
    return;
  }

  try {
    const res = await fetch(`/api/blog/posts/${slug}`);
    const post = await res.json();
    if (!post) throw new Error('Not found');

    document.title = `${post.title} — Trinnity Viseron`;

    document.getElementById('post-container').innerHTML = `
      <div>
        <div class="flex flex-wrap gap-2 mb-6">
          ${post.tags.map(t => `<span class="badge-neon">${t}</span>`).join('')}
        </div>
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold font-['Space_Grotesk'] leading-tight mb-4">${post.title}</h1>
        <div class="flex items-center gap-4 text-sm text-white/20 mb-8 pb-8 border-b border-white/5">
          <span>${post.author}</span>
          <span>${new Date(post.publishedAt || post.createdAt).toLocaleDateString('pt-BR', {day:'numeric',month:'long',year:'numeric'})}</span>
        </div>
        <div class="post-content">${post.contentHtml || post.content}</div>
      </div>
    `;
  } catch (err) {
    document.getElementById('post-container').innerHTML = '<div class="text-center text-white/20 py-20"><p class="text-6xl mb-4">📄</p><p>Post não encontrado.</p></div>';
  }
}

document.addEventListener('DOMContentLoaded', loadPost);
</script>
</body>
</html>
