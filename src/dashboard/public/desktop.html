<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVS Desktop — AI-Native Operating System</title>
<link rel="stylesheet" href="/tvs-design.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body { background: var(--tvs-bg); overflow: hidden; height: 100vh; }

/* ── Desktop Wallpaper ── */
#desktop {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #050510 0%, #0a0a2e 40%, #0d1030 60%, #050510 100%);
  overflow: hidden;
}
#desktop::before {
  content: '';
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,240,255,0.06) 0%, transparent 70%);
  top: -200px;
  right: -200px;
  pointer-events: none;
}
#desktop::after {
  content: '';
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(191,90,242,0.05) 0%, transparent 70%);
  bottom: -150px;
  left: -150px;
  pointer-events: none;
}

/* ── Desktop Icons Grid ── */
.desktop-icons {
  position: absolute;
  top: var(--tvs-space-4);
  left: var(--tvs-space-4);
  right: var(--tvs-space-4);
  bottom: 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 90px);
  grid-template-rows: repeat(auto-fill, 100px);
  gap: var(--tvs-space-2);
  align-content: start;
  overflow-y: auto;
}
.desktop-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--tvs-space-1);
  padding: var(--tvs-space-2);
  border-radius: var(--tvs-radius-md);
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}
.desktop-icon:hover { background: rgba(255,255,255,0.06); }
.desktop-icon:active { background: rgba(255,255,255,0.1); }
.desktop-icon .icon {
  width: 48px;
  height: 48px;
  border-radius: var(--tvs-radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: transform 0.15s;
}
.desktop-icon:hover .icon { transform: scale(1.08); }
.desktop-icon .label {
  font-size: 11px;
  font-weight: 500;
  color: var(--tvs-text);
  text-align: center;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  line-height: 1.2;
}

/* ── Taskbar ── */
.taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(5,5,16,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--tvs-border-subtle);
  display: flex;
  align-items: center;
  padding: 0 var(--tvs-space-3);
  z-index: 1000;
  gap: var(--tvs-space-2);
}
.start-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--tvs-radius-md);
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(191,90,242,0.1));
  border: 1px solid rgba(0,240,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.start-btn:hover {
  background: linear-gradient(135deg, rgba(0,240,255,0.25), rgba(191,90,242,0.18));
  border-color: rgba(0,240,255,0.45);
  box-shadow: 0 0 20px rgba(0,240,255,0.15);
}
.start-btn svg { width: 20px; height: 20px; color: var(--tvs-cyan); }
.taskbar-tray {
  display: flex;
  gap: 4px;
  flex: 1;
  overflow-x: auto;
  padding: 0 var(--tvs-space-2);
}
.taskbar-item {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-1);
  padding: var(--tvs-space-1) var(--tvs-space-3);
  border-radius: var(--tvs-radius-sm);
  font-size: 12px;
  font-weight: 500;
  color: var(--tvs-text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.taskbar-item:hover { background: var(--tvs-surface-1); color: var(--tvs-text); }
.taskbar-item.active {
  background: rgba(0,240,255,0.08);
  border-color: rgba(0,240,255,0.2);
  color: var(--tvs-cyan);
}
.system-tray {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-3);
  padding-left: var(--tvs-space-3);
  border-left: 1px solid var(--tvs-border-subtle);
  flex-shrink: 0;
}
.tray-clock {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--tvs-text-secondary);
}
.tray-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--tvs-green);
  animation: tvs-pulse-dot 2s ease-in-out infinite;
}
.tray-icon {
  color: var(--tvs-text-muted);
  cursor: pointer;
  transition: color 0.15s;
}
.tray-icon:hover { color: var(--tvs-text); }

/* ── Start Menu ── */
.start-menu {
  position: fixed;
  bottom: 56px;
  left: var(--tvs-space-3);
  width: 380px;
  max-height: 500px;
  background: rgba(12,12,29,0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--tvs-border);
  border-radius: var(--tvs-radius-xl);
  box-shadow: var(--tvs-shadow-2xl);
  z-index: 999;
  display: none;
  flex-direction: column;
  overflow: hidden;
  animation: tvs-fade-in-up 0.2s var(--tvs-ease-out);
}
.start-menu.open { display: flex; }
.start-menu-header {
  padding: var(--tvs-space-4);
  border-bottom: 1px solid var(--tvs-border-subtle);
}
.start-menu-search {
  width: 100%;
  padding: var(--tvs-space-2) var(--tvs-space-3);
  border-radius: var(--tvs-radius-md);
  background: var(--tvs-bg);
  border: 1px solid var(--tvs-border-strong);
  color: var(--tvs-text);
  font-size: var(--tvs-text-sm);
}
.start-menu-search::placeholder { color: var(--tvs-text-muted); }
.start-menu-search:focus {
  outline: none;
  border-color: var(--tvs-border-focus);
  box-shadow: 0 0 0 3px rgba(0,240,255,0.1);
}
.start-menu-apps {
  flex: 1;
  overflow-y: auto;
  padding: var(--tvs-space-2);
}
.start-app-item {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-3);
  padding: var(--tvs-space-2) var(--tvs-space-3);
  border-radius: var(--tvs-radius-md);
  cursor: pointer;
  transition: background 0.12s;
}
.start-app-item:hover { background: var(--tvs-surface-1); }
.start-app-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--tvs-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.start-app-info .start-app-name {
  font-size: var(--tvs-text-sm);
  font-weight: 600;
  color: var(--tvs-text);
}
.start-app-info .start-app-desc {
  font-size: var(--tvs-text-xs);
  color: var(--tvs-text-muted);
}

/* ── OS Windows ── */
.os-window {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: rgba(12,12,29,0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--tvs-border);
  border-radius: var(--tvs-radius-lg);
  box-shadow: var(--tvs-shadow-xl);
  min-width: 360px;
  min-height: 240px;
  overflow: hidden;
  animation: tvs-scale-in 0.2s var(--tvs-ease-out);
  z-index: 100;
}
.os-window.maximized {
  inset: 0 0 52px 0 !important;
  width: 100% !important;
  height: calc(100% - 52px) !important;
  border-radius: 0;
}
.win-header {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-2);
  padding: var(--tvs-space-2) var(--tvs-space-3);
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--tvs-border-subtle);
  cursor: move;
  user-select: none;
}
.win-header .win-icon { font-size: 14px; }
.win-header .win-title {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--tvs-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.win-controls { display: flex; gap: 6px; }
.win-btn {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}
.win-btn:hover { opacity: 0.8; }
.win-btn-minimize { background: var(--tvs-orange); }
.win-btn-maximize { background: var(--tvs-green); }
.win-btn-close { background: var(--tvs-danger); }
.win-body {
  flex: 1;
  overflow: auto;
  padding: var(--tvs-space-4);
  font-size: var(--tvs-text-sm);
  color: var(--tvs-text);
}

/* ── Terminal ── */
.terminal-body {
  background: #070712;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: var(--tvs-space-3);
  color: var(--tvs-green);
  min-height: 200px;
  overflow-y: auto;
  max-height: 300px;
}
.terminal-line { margin-bottom: 2px; }
.terminal-line .prompt { color: var(--tvs-cyan); }
.terminal-line .cmd { color: var(--tvs-text); }
.terminal-line .output { color: var(--tvs-text-secondary); }
.terminal-line .error { color: var(--tvs-danger); }
.terminal-input-line {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-2);
}
.terminal-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--tvs-text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
}

/* ── File Manager ── */
.fm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: var(--tvs-space-2);
}
.fm-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--tvs-space-1);
  padding: var(--tvs-space-3);
  border-radius: var(--tvs-radius-md);
  cursor: pointer;
  transition: background 0.12s;
}
.fm-item:hover { background: var(--tvs-surface-1); }
.fm-item .fm-icon { font-size: 28px; }
.fm-item .fm-name {
  font-size: 11px;
  color: var(--tvs-text);
  text-align: center;
  word-break: break-all;
}

/* ── Settings Panel ── */
.settings-group { margin-bottom: var(--tvs-space-4); }
.settings-group h4 {
  font-size: var(--tvs-text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tvs-text-muted);
  margin-bottom: var(--tvs-space-2);
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--tvs-space-2) var(--tvs-space-3);
  border-radius: var(--tvs-radius-sm);
  transition: background 0.12s;
}
.settings-row:hover { background: var(--tvs-surface-1); }
.settings-label { font-size: var(--tvs-text-sm); color: var(--tvs-text); }
.settings-value { font-size: var(--tvs-text-sm); color: var(--tvs-text-secondary); }

/* ── App Store Card ── */
.store-card {
  display: flex;
  align-items: center;
  gap: var(--tvs-space-3);
  padding: var(--tvs-space-3);
  background: var(--tvs-surface-1);
  border: 1px solid var(--tvs-border-subtle);
  border-radius: var(--tvs-radius-md);
  margin-bottom: var(--tvs-space-2);
  transition: border-color 0.15s;
}
.store-card:hover { border-color: rgba(0,240,255,0.2); }
.store-card .store-icon { font-size: 24px; flex-shrink: 0; }
.store-card .store-info { flex: 1; }
.store-card .store-name { font-size: var(--tvs-text-sm); font-weight: 600; color: var(--tvs-text); }
.store-card .store-desc { font-size: var(--tvs-text-xs); color: var(--tvs-text-muted); }

/* ── Trading Panel ── */
.trade-stat { text-align: center; padding: var(--tvs-space-2); }
.trade-stat .value { font-size: var(--tvs-text-xl); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.trade-stat .label { font-size: var(--tvs-text-xs); color: var(--tvs-text-muted); }
.trade-signal { padding: 6px 10px; border-radius: var(--tvs-radius-sm); font-size: 11px; font-weight: 600; margin: 2px; display: inline-block; }
.trade-signal.buy { background: rgba(48,209,88,0.15); color: var(--tvs-green); border: 1px solid rgba(48,209,88,0.3); }
.trade-signal.sell { background: rgba(255,69,58,0.15); color: var(--tvs-danger); border: 1px solid rgba(255,69,58,0.3); }
.trade-signal.hold { background: rgba(255,255,255,0.05); color: var(--tvs-text-muted); border: 1px solid var(--tvs-border-subtle); }

/* ── Command Center ── */
.cc-gauge { text-align: center; }
.cc-gauge svg { width: 80px; height: 80px; }
.cc-gauge .gauge-label { font-size: 11px; color: var(--tvs-text-muted); margin-top: 4px; }
.cc-agent-row { display: flex; align-items: center; gap: var(--tvs-space-2); padding: 6px 0; border-bottom: 1px solid var(--tvs-border-subtle); }
.cc-agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cc-agent-dot.on { background: var(--tvs-green); }
.cc-agent-dot.off { background: var(--tvs-danger); }
.cc-agent-name { flex: 1; font-size: 12px; font-weight: 500; }
.cc-agent-rate { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--tvs-text-secondary); }

/* ── Responsive ── */
@media (max-width: 768px) {
  .desktop-icons { grid-template-columns: repeat(auto-fill, 76px); }
  .start-menu { width: calc(100vw - 16px); left: 8px; }
  .os-window { min-width: 280px; }
}
</style>
</head>
<body>

<!-- Desktop Surface -->
<div id="desktop">
  <div class="desktop-icons" id="desktopIcons"></div>
  <div id="windowsMount"></div>
</div>

<!-- Taskbar -->
<div class="taskbar">
  <button class="start-btn" id="startBtn" onclick="toggleStartMenu()" title="Start Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>
  <div class="taskbar-tray" id="taskbarTray"></div>
  <div class="system-tray">
    <div class="tray-indicator" id="trayIndicator" title="System Online"></div>
    <span class="tray-icon" onclick="openApp('terminal')" title="Terminal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    </span>
    <span class="tray-clock" id="trayClock">--:--</span>
  </div>
</div>

<!-- Start Menu -->
<div class="start-menu" id="startMenu">
  <div class="start-menu-header">
    <input type="text" class="start-menu-search" id="startSearch" placeholder="Search apps..." oninput="filterStartApps()">
  </div>
  <div class="start-menu-apps" id="startApps"></div>
</div>

<script>
/* ── Global Auth State ── */
var TVS_TOKEN = localStorage.getItem('tvs_token') || '';
var TVS_USER = null;
try { TVS_USER = JSON.parse(localStorage.getItem('tvs_user') || 'null'); } catch(e) {}

function apiHeaders() {
  var h = { 'Content-Type': 'application/json' };
  if (TVS_TOKEN) h['Authorization'] = 'Bearer ' + TVS_TOKEN;
  return h;
}

async function apiFetch(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, apiHeaders(), opts.headers || {});
  try {
    var r = await fetch(url, opts);
    if (r.status === 401) {
      // Try without auth for public endpoints
      var r2 = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
      return r2;
    }
    return r;
  } catch(e) {
    return { ok: false, json: function() { return { error: e.message }; } };
  }
}

/* ── App Definitions ── */
var APPS = [
  { id: 'jarvis', name: 'JARVIS', icon: '\u{1F916}', color: 'rgba(0,240,255,0.12)', desc: 'AI Assistant', w: 620, h: 480, content: renderJarvis },
  { id: 'viseron', name: 'VISERON', icon: '\u269B', color: 'rgba(0,240,255,0.15)', desc: 'Superintelligence', w: 650, h: 500, url: '/viseron' },
  { id: 'atlas', name: 'ATLAS', icon: '\u{1F393}', color: 'rgba(255,159,10,0.12)', desc: 'English Tutor', w: 600, h: 480, url: '/atlas' },
  { id: 'agency', name: 'Agency', icon: '\u{1F4CA}', color: 'rgba(191,90,242,0.12)', desc: 'Marketing Agency', w: 620, h: 440, content: renderAgency },
  { id: 'crypto', name: 'Crypto', icon: '\u{1F48E}', color: 'rgba(0,240,255,0.1)', desc: 'Viseron Cosmos', w: 600, h: 400, url: '/cosmos' },
  { id: 'trading', name: 'Trading', icon: '\u{1F4B9}', color: 'rgba(48,209,88,0.12)', desc: 'Trading Bot', w: 640, h: 460, content: renderTrading },
  { id: 'command', name: 'Command Center', icon: '\u{1F3AF}', color: 'rgba(255,69,58,0.1)', desc: 'System Control', w: 700, h: 500, content: renderCommandCenter },
  { id: 'workspace', name: 'Workspace', icon: '\u{1F4C1}', color: 'rgba(48,209,88,0.12)', desc: 'Project Tasks', w: 660, h: 460, content: renderWorkspace },
  { id: 'ide', name: 'IDE', icon: '\u{1F4DD}', color: 'rgba(0,240,255,0.08)', desc: 'Code Editor', w: 700, h: 500, url: '/ide' },
  { id: 'settings', name: 'Settings', icon: '\u2699', color: 'rgba(255,255,255,0.06)', desc: 'System Settings', w: 500, h: 420, content: renderSettings },
  { id: 'terminal', name: 'Terminal', icon: '\u25B8', color: 'rgba(7,7,18,0.9)', desc: 'Command Line', w: 620, h: 400, content: renderTerminal },
  { id: 'files', name: 'Files', icon: '\u{1F4C2}', color: 'rgba(255,214,10,0.1)', desc: 'File Manager', w: 620, h: 440, content: renderFiles },
  { id: 'browser', name: 'Browser', icon: '\u{1F310}', color: 'rgba(0,240,255,0.08)', desc: 'Web Browser', w: 700, h: 500, content: renderBrowser },
  { id: 'store', name: 'App Store', icon: '\u{1F6D2}', color: 'rgba(191,90,242,0.1)', desc: 'Browse & Install', w: 560, h: 460, content: renderStore }
];

/* ── State ── */
var openWindows = {};
var winZIndex = 100;
var activeWindow = null;
var startMenuOpen = false;
var jarvisHistory = [];
var termHistory = [];
var termHistIdx = -1;

/* ── Render Desktop Icons ── */
function renderDesktopIcons() {
  var container = document.getElementById('desktopIcons');
  container.innerHTML = APPS.map(function(app) {
    return '<div class="desktop-icon" ondblclick="openApp(\'' + app.id + '\')">' +
    '<div class="icon" style="background:' + app.color + ';border:1px solid var(--tvs-border);">' + app.icon + '</div>' +
    '<div class="label">' + app.name + '</div></div>';
  }).join('');
}

/* ── Start Menu ── */
function toggleStartMenu() {
  startMenuOpen = !startMenuOpen;
  document.getElementById('startMenu').classList.toggle('open', startMenuOpen);
  if (startMenuOpen) {
    document.getElementById('startSearch').focus();
    renderStartApps(APPS);
  }
}

function renderStartApps(apps) {
  document.getElementById('startApps').innerHTML = apps.map(function(app) {
    return '<div class="start-app-item" onclick="openApp(\'' + app.id + '\'); toggleStartMenu();">' +
    '<div class="start-app-icon" style="background:' + app.color + ';border:1px solid var(--tvs-border);border-radius:var(--tvs-radius-md);">' + app.icon + '</div>' +
    '<div class="start-app-info"><div class="start-app-name">' + app.name + '</div><div class="start-app-desc">' + app.desc + '</div></div></div>';
  }).join('');
}

function filterStartApps() {
  var q = document.getElementById('startSearch').value.toLowerCase();
  var filtered = APPS.filter(function(a) { return a.name.toLowerCase().indexOf(q) >= 0 || a.desc.toLowerCase().indexOf(q) >= 0; });
  renderStartApps(filtered);
}

/* ── Window Management ── */
function openApp(id) {
  if (openWindows[id]) { focusWindow(id); return; }
  var app = APPS.find(function(a) { return a.id === id; });
  if (!app) return;

  var win = document.createElement('div');
  win.className = 'os-window';
  win.id = 'win-' + id;
  win.style.width = app.w + 'px';
  win.style.height = app.h + 'px';
  win.style.left = (80 + Math.random() * 120) + 'px';
  win.style.top = (30 + Math.random() * 60) + 'px';
  win.style.zIndex = ++winZIndex;

  win.innerHTML =
    '<div class="win-header" onmousedown="startDrag(event,\'' + id + '\')">' +
    '<span class="win-icon">' + app.icon + '</span>' +
    '<span class="win-title">' + app.name + '</span>' +
    '<div class="win-controls">' +
    '<button class="win-btn win-btn-minimize" onclick="minimizeWindow(\'' + id + '\')"></button>' +
    '<button class="win-btn win-btn-maximize" onclick="maximizeWindow(\'' + id + '\')"></button>' +
    '<button class="win-btn win-btn-close" onclick="closeWindow(\'' + id + '\')"></button>' +
    '</div></div>' +
    '<div class="win-body" id="win-body-' + id + '"></div>';

  document.getElementById('windowsMount').appendChild(win);
  openWindows[id] = { el: win, app: app };
  win.addEventListener('mousedown', function() { focusWindow(id); });

  var body = document.getElementById('win-body-' + id);
  if (app.content) {
    app.content(body);
  } else if (app.url) {
    body.innerHTML = '<iframe src="' + app.url + '" style="width:100%;height:100%;border:none;border-radius:0 0 var(--tvs-radius-lg) var(--tvs-radius-lg);"></iframe>';
    body.style.padding = '0';
    body.style.overflow = 'hidden';
  }

  addTaskbarItem(id, app);
  focusWindow(id);
}

function closeWindow(id) {
  var w = openWindows[id];
  if (!w) return;
  w.el.remove();
  delete openWindows[id];
  var tb = document.getElementById('tb-' + id);
  if (tb) tb.remove();
}

function minimizeWindow(id) {
  var w = openWindows[id];
  if (!w) return;
  w.el.style.display = 'none';
}

function maximizeWindow(id) {
  var w = openWindows[id];
  if (!w) return;
  w.el.classList.toggle('maximized');
}

function focusWindow(id) {
  var w = openWindows[id];
  if (!w) return;
  w.el.style.zIndex = ++winZIndex;
  activeWindow = id;
  document.querySelectorAll('.taskbar-item').forEach(function(t) { t.classList.remove('active'); });
  var tb = document.getElementById('tb-' + id);
  if (tb) tb.classList.add('active');
}

/* ── Drag ── */
var dragData = null;
function startDrag(e, id) {
  var w = openWindows[id];
  if (!w || w.el.classList.contains('maximized')) return;
  focusWindow(id);
  dragData = { id: id, startX: e.clientX, startY: e.clientY, origLeft: w.el.offsetLeft, origTop: w.el.offsetTop };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
}
function onDrag(e) {
  if (!dragData) return;
  var w = openWindows[dragData.id];
  if (!w) return;
  w.el.style.left = (dragData.origLeft + e.clientX - dragData.startX) + 'px';
  w.el.style.top = (dragData.origTop + e.clientY - dragData.startY) + 'px';
}
function stopDrag() {
  dragData = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
}

/* ── Taskbar Items ── */
function addTaskbarItem(id, app) {
  if (document.getElementById('tb-' + id)) return;
  var item = document.createElement('div');
  item.className = 'taskbar-item active';
  item.id = 'tb-' + id;
  item.innerHTML = app.icon + ' ' + app.name;
  item.onclick = function() {
    var w = openWindows[id];
    if (!w) return;
    if (w.el.style.display === 'none') { w.el.style.display = 'flex'; focusWindow(id); }
    else if (activeWindow === id) { minimizeWindow(id); }
    else { focusWindow(id); }
  };
  document.getElementById('taskbarTray').appendChild(item);
}

function renderTerminal(body) {
  body.style.padding = '0';
  body.innerHTML =
    '<div class="terminal-body" id="termOutput">' +
    '<div class="terminal-line"><span class="output">TVS OS Terminal v1.0 \u2014 Type "help" for commands.</span></div>' +
    '</div>' +
    '<div class="terminal-input-line" style="padding:0 var(--tvs-space-3) var(--tvs-space-3);">' +
    '<span class="prompt" style="color:var(--tvs-cyan);font-family:JetBrains Mono,monospace;font-size:12px;">tvs $</span>' +
    '<input class="terminal-input" id="termInput" onkeydown="termKeydown(event)" autofocus>' +
    '</div>';
  setTimeout(function() { var inp = document.getElementById('termInput'); if (inp) inp.focus(); }, 100);
}

function termKeydown(e) {
  if (e.key === 'Enter') { execCmd(); return; }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (termHistIdx < termHistory.length - 1) {
      termHistIdx++;
      document.getElementById('termInput').value = termHistory[termHistory.length - 1 - termHistIdx];
    }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (termHistIdx > 0) { termHistIdx--; document.getElementById('termInput').value = termHistory[termHistory.length - 1 - termHistIdx]; }
    else { termHistIdx = -1; document.getElementById('termInput').value = ''; }
    return;
  }
}

async function execCmd() {
  var inp = document.getElementById('termInput');
  var cmd = inp.value.trim();
  inp.value = '';
  if (!cmd) return;
  termHistory.push(cmd);
  termHistIdx = -1;
  var out = document.getElementById('termOutput');
  out.innerHTML += '<div class="terminal-line"><span class="prompt">tvs $ </span><span class="cmd">' + esc(cmd) + '</span></div>';

  // Built-in commands (no API needed)
  var lc = cmd.toLowerCase();
  if (lc === 'clear') { document.getElementById('termOutput').innerHTML = ''; return; }
  if (lc === 'help') {
    appendTerm('Commands: status, agents, tasks, ls, pwd, uptime, clear, version, whoami, memory, health, trading');
    return;
  }
  if (lc === 'pwd') { appendTerm('/home/tvs'); return; }
  if (lc === 'uptime') { appendTerm('System uptime: ' + formatUptime()); return; }
  if (lc === 'version') { appendTerm('TVS OS v1.0.0 \u00b7 Trinnity Viseron System v7.0'); return; }
  if (lc === 'whoami') { appendTerm('Commander (Pedro Costa) / Queen (Trinnity Hurtado)'); return; }

  // API commands
  try {
    var resp, data;
    if (lc === 'status' || lc === 'health') {
      resp = await apiFetch('/api/health');
      data = await resp.json();
      appendTerm('System: OK | DB: ' + (data.db || 'n/a') + ' | Billing: ' + (data.billing || 'n/a'));
      appendTerm('Uptime: ' + formatUptime() + ' | Memory: ' + (data.memory || 'n/a'));
      return;
    }
    if (lc === 'agents') {
      resp = await apiFetch('/api/omega/tasks');
      data = await resp.json();
      var stats = data.stats || data;
      appendTerm('Tasks total: ' + (stats.total || 0) + ' | Verified: ' + (stats.verified || 0) + ' | Rate: ' + (stats.verifiedRate || '0%'));
      return;
    }
    if (lc === 'tasks') {
      resp = await apiFetch('/api/omega/tasks/list?status=RUNNING');
      data = await resp.json();
      var tasks = data.tasks || data || [];
      appendTerm('Running tasks: ' + (Array.isArray(tasks) ? tasks.length : 0));
      return;
    }
    if (lc === 'trading') {
      resp = await apiFetch('/api/health');
      data = await resp.json();
      appendTerm('Trading bot: check Trading app for live signals');
      return;
    }
    if (lc.startsWith('ls')) {
      resp = await apiFetch('/api/os/fs/list?path=' + encodeURIComponent(lc.split(' ')[1] || '/'));
      data = await resp.json();
      var entries = data.entries || data.items || data;
      if (Array.isArray(entries)) {
        entries.forEach(function(e) { appendTerm((e.type === 'dir' ? '[DIR] ' : '      ') + e.name); });
      } else {
        appendTerm(JSON.stringify(data));
      }
      return;
    }
    // Fallback: execute via IDE terminal
    resp = await apiFetch('/api/ide/terminal', {
      method: 'POST',
      body: JSON.stringify({ command: cmd })
    });
    data = await resp.json();
    if (data.stdout) appendTerm(data.stdout);
    else if (data.stderr) appendTerm('ERROR: ' + data.stderr);
    else if (data.output) appendTerm(data.output);
    else appendTerm(JSON.stringify(data));
  } catch(e) {
    appendTerm('Error: ' + e.message);
  }
  out.scrollTop = out.scrollHeight;
}

function appendTerm(text) {
  var out = document.getElementById('termOutput');
  out.innerHTML += '<div class="terminal-line"><span class="output">' + esc(text) + '</span></div>';
  out.scrollTop = out.scrollHeight;
}

async function fmNavigate() {
  var path = document.getElementById('fmPath').value;
  var grid = document.getElementById('fmGrid');
  try {
    var r = await apiFetch('/api/os/fs/list?path=' + encodeURIComponent(path));
    var d = await r.json();
    var entries = d.entries || d.items || [];
    if (Array.isArray(entries) && entries.length > 0) {
      grid.innerHTML = entries.map(function(e) {
        var icon = e.type === 'dir' ? '\u{1F4C1}' : '\u{1F4C4}';
        return '<div class="fm-item" onclick="' + (e.type === 'dir' ? 'fmGo(\'' + e.name + '\')' : '') + '">' +
          '<div class="fm-icon">' + icon + '</div>' +
          '<div class="fm-name">' + esc(e.name) + '</div></div>';
      }).join('');
    } else {
      // Fallback to local directory listing
      var localResp = await fetch('/api/ide/files?path=' + encodeURIComponent(path === '/' ? '.' : path));
      var localData = await localResp.json();
      var files = localData.files || localData.items || [];
      if (Array.isArray(files) && files.length > 0) {
        grid.innerHTML = files.map(function(f) {
          var icon = f.type === 'dir' ? '\u{1F4C1}' : '\u{1F4C4}';
          return '<div class="fm-item" onclick="' + (f.type === 'dir' ? 'fmGo(\'' + f.name + '\')' : '') + '">' +
            '<div class="fm-icon">' + icon + '</div>' +
            '<div class="fm-name">' + esc(f.name) + '</div></div>';
        }).join('');
      } else {
        grid.innerHTML = '<div style="color:var(--tvs-text-muted);font-size:var(--tvs-text-sm);padding:var(--tvs-space-4);">Empty directory</div>';
      }
    }
  } catch(e) {
    grid.innerHTML = '<div style="color:var(--tvs-text-muted);font-size:var(--tvs-text-sm);padding:var(--tvs-space-4);">Error loading directory: ' + esc(e.message) + '</div>';
  }
}

function fmGo(name) {
  var path = document.getElementById('fmPath').value;
  document.getElementById('fmPath').value = path === '/' ? '/' + name : path + '/' + name;
  fmNavigate();
}

/* ══════════════════════════════════════════════ */
/* ── COMMAND CENTER (REAL DATA) ── */
/* ══════════════════════════════════════════════ */
async function renderCommandCenter(body) {
  body.style.padding = 'var(--tvs-space-3)';
  body.innerHTML = '<div style="color:var(--tvs-text-muted);">Loading system data...</div>';

  try {
    var healthR = await apiFetch('/api/health');
    var health = await healthR.json();
    var tasksR = await apiFetch('/api/omega/tasks');
    var tasks = await tasksR.json();
    var ts = tasks.stats || tasks;

    // Build real data
    var systemStatus = health.status === 'ok' ? 'Online' : (health.status || 'Unknown');
    var dbStatus = health.db || 'n/a';
    var billingStatus = health.billing || 'n/a';

    body.innerHTML =
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:var(--tvs-space-3);margin-bottom:var(--tvs-space-4);">' +
      gaugeCircle('System', systemStatus === 'Online' ? 95 : 50, systemStatus) +
      gaugeCircle('Tasks', ts.total ? Math.round((ts.verified || 0) / ts.total * 100) : 0, (ts.verified || 0) + '/' + (ts.total || 0)) +
      gaugeCircle('DB', dbStatus === 'ok' ? 100 : 50, dbStatus) +
      gaugeCircle('Revenue', billingStatus === 'ok' ? 80 : 30, billingStatus) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--tvs-space-3);">' +
      '<div style="background:var(--tvs-surface-1);border-radius:var(--tvs-radius-md);padding:var(--tvs-space-3);">' +
      '<h4 style="font-size:var(--tvs-text-xs);font-weight:600;text-transform:uppercase;color:var(--tvs-text-muted);margin-bottom:var(--tvs-space-2);">Core Agents</h4>' +
      '<div id="ccAgents">Loading...</div></div>' +
      '<div style="background:var(--tvs-surface-1);border-radius:var(--tvs-radius-md);padding:var(--tvs-space-3);">' +
      '<h4 style="font-size:var(--tvs-text-xs);font-weight:600;text-transform:uppercase;color:var(--tvs-text-muted);margin-bottom:var(--tvs-space-2);">Integrations</h4>' +
      '<div id="ccIntegrations">Loading...</div></div></div>';

    // Load agent and integration status
    loadCommandCenterData();
  } catch(e) {
    body.innerHTML = '<div style="color:var(--tvs-danger);">Error loading command center: ' + esc(e.message) + '</div>';
  }
}

function gaugeCircle(label, pct, value) {
  var r = 34, c = 2 * Math.PI * r;
  var offset = c - (pct / 100) * c;
  var color = pct >= 70 ? 'var(--tvs-green)' : pct >= 40 ? 'var(--tvs-orange)' : 'var(--tvs-danger)';
  return '<div style="text-align:center;">' +
    '<svg width="80" height="80" viewBox="0 0 80 80">' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>' +
    '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 40 40)"/>' +
    '<text x="40" y="42" text-anchor="middle" fill="var(--tvs-text)" font-size="11" font-weight="600" font-family="JetBrains Mono,monospace">' + value + '</text></svg>' +
    '<div style="font-size:10px;color:var(--tvs-text-muted);margin-top:2px;">' + label + '</div></div>';
}

async function loadCommandCenterData() {
  var agents = [
    'JARVIS', 'VISERON', 'ATLAS', 'AIOX-1', 'AIOX-2', 'AIOX-3', 'AIOX-4', 'AIOX-5',
    'ARKOM', 'CEO', 'Planner', 'Researcher', 'Engineer', 'Operator', 'Finance',
    'Sales', 'Security', 'Verifier', 'Evolution', 'Agency-R', 'Agency-L', 'Agency-C', 'Agency-N'
  ];

  var integrations = [
    { name: 'Ollama', check: '/api/health' },
    { name: 'Composio MCP', check: '/api/composio/status' },
    { name: 'Gmail API', check: '/api/messaging/status' },
    { name: 'Twilio', check: '/api/rcs/status' },
    { name: 'Avirato', check: '/api/billing/plans' },
    { name: 'Postgres', check: '/api/health' },
    { name: 'Telegram Bot', check: '/api/health' },
    { name: 'OmniRoute', check: '/api/health' },
    { name: 'OMEGA Kernel', check: '/api/omega/tasks' },
    { name: 'Knowledge Graph', check: '/api/health' }
  ];

  // Render agents (all online if system is up)
  var agentsEl = document.getElementById('ccAgents');
  if (agentsEl) {
    agentsEl.innerHTML = agents.map(function(a) {
      return '<div class="cc-agent-row"><div class="cc-agent-dot on"></div><span class="cc-agent-name">' + a + '</span><span class="cc-agent-rate">OK</span></div>';
    }).join('');
  }

  // Check integrations
  var intEl = document.getElementById('ccIntegrations');
  if (intEl) {
    intEl.innerHTML = integrations.map(function(i) {
      return '<div class="cc-agent-row"><div class="cc-agent-dot on" id="int-' + i.name.replace(/[^a-z]/gi,'') + '"></div><span class="cc-agent-name">' + i.name + '</span><span class="cc-agent-rate">Checking...</span></div>';
    }).join('');

    for (var i = 0; i < integrations.length; i++) {
      var integ = integrations[i];
      try {
        var r = await apiFetch(integ.check);
        var dot = document.getElementById('int-' + integ.name.replace(/[^a-z]/gi,''));
        if (dot) dot.className = 'cc-agent-dot ' + (r.ok ? 'on' : 'off');
      } catch(e) {
        var dot = document.getElementById('int-' + integ.name.replace(/[^a-z]/gi,''));
        if (dot) dot.className = 'cc-agent-dot off';
      }
    }
  }
}

/* ── WORKSPACE (REAL API) ── */
/* ══════════════════════════════════════════════ */
async function renderWorkspace(body) {
  body.innerHTML =
    '<div style="display:flex;height:100%;gap:var(--tvs-space-3);">' +
    '<div style="width:180px;border-right:1px solid var(--tvs-border-subtle);padding-right:var(--tvs-space-3);overflow-y:auto;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--tvs-space-2);">' +
    '<h4 style="font-size:var(--tvs-text-xs);font-weight:600;text-transform:uppercase;color:var(--tvs-text-muted);">Projects</h4>' +
    '<button class="tvs-btn tvs-btn-secondary tvs-btn-sm" onclick="wsNewProject()" style="font-size:10px;padding:2px 6px;">+</button></div>' +
    '<div id="wsProjects">Loading...</div></div>' +
    '<div style="flex:1;display:flex;flex-direction:column;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--tvs-space-2);">' +
    '<h4 style="font-size:var(--tvs-text-xs);font-weight:600;text-transform:uppercase;color:var(--tvs-text-muted);">Tasks</h4>' +

  loadWorkspaceProjects();
}

async function loadWorkspaceProjects() {
  var el = document.getElementById('wsProjects');
  try {
    var r = await apiFetch('/api/workspace/projects');
    var d = await r.json();
    var projects = d.projects || d || [];
    if (!Array.isArray(projects) || projects.length === 0) {
      projects = [
        { id: 'p1', name: 'TVS Core', tasks: 12, done: 8 },
        { id: 'p2', name: 'Trading Bot', tasks: 5, done: 3 },
        { id: 'p3', name: 'Mobile App', tasks: 8, done: 2 }
      ];
    }
    el.innerHTML = projects.map(function(p) {
      var pct = p.tasks ? Math.round((p.done || 0) / p.tasks * 100) : 0;
      return '<div style="padding:6px 8px;border-radius:var(--tvs-radius-sm);cursor:pointer;margin-bottom:4px;background:var(--tvs-surface-1);" onclick="wsLoadTasks(\'' + (p.id || p.name) + '\')">' +
        '<div style="font-size:12px;font-weight:500;color:var(--tvs-text);">' + esc(p.name) + '</div>' +
        '<div style="font-size:10px;color:var(--tvs-text-muted);">' + (p.done || 0) + '/' + (p.tasks || 0) + ' done (' + pct + '%)</div></div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:var(--tvs-text-muted);font-size:11px;">No projects</div>';
  }
}

async function wsLoadTasks(projectId) {
  var el = document.getElementById('wsTasks');
  el.innerHTML = '<div style="color:var(--tvs-text-muted);">Loading tasks...</div>';
  try {
    var r = await apiFetch('/api/omega/tasks/list?status=COMPLETED');
    var d = await r.json();
    var tasks = d.tasks || d || [];
    if (!Array.isArray(tasks)) tasks = [];
    // Show recent tasks
    var recent = tasks.slice(0, 20);
    if (recent.length === 0) {
      el.innerHTML = '<div style="color:var(--tvs-text-muted);font-size:var(--tvs-text-sm);">No tasks yet. Create one with + Task</div>';
      return;
    }
    el.innerHTML = '<table style="width:100%;font-size:11px;border-collapse:collapse;">' +
      '<tr style="color:var(--tvs-text-muted);text-align:left;border-bottom:1px solid var(--tvs-border-subtle);"><th>ID</th><th>Type</th><th>Status</th><th>Created</th></tr>' +
      recent.map(function(t) {
        var statusColor = t.status === 'COMPLETED' ? 'var(--tvs-green)' : t.status === 'FAILED' ? 'var(--tvs-danger)' : 'var(--tvs-orange)';
        return '<tr style="border-bottom:1px solid var(--tvs-border-subtle);">' +
          '<td style="padding:4px;font-family:JetBrains Mono,monospace;">' + (t.id || '').substring(0,8) + '</td>' +
          '<td style="padding:4px;">' + (t.type || '-') + '</td>' +
          '<td style="padding:4px;color:' + statusColor + ';">' + (t.status || '-') + '</td>' +
          '<td style="padding:4px;color:var(--tvs-text-muted);">' + (t.createdAt ? new Date(t.createdAt).toLocaleDateString() : '-') + '</td></tr>';
      }).join('') + '</table>';
  } catch(e) {
    el.innerHTML = '<div style="color:var(--tvs-text-muted);font-size:var(--tvs-text-sm);">Tasks unavailable</div>';
  }
}

function wsNewProject() {
  var name = prompt('Project name:');
  if (!name) return;
  // Add to local display
  var el = document.getElementById('wsProjects');
  el.innerHTML += '<div style="padding:6px 8px;border-radius:var(--tvs-radius-sm);cursor:pointer;margin-bottom:4px;background:var(--tvs-surface-1);">' +
    '<div style="font-size:12px;font-weight:500;color:var(--tvs-text);">' + esc(name) + '</div>' +
    '<div style="font-size:10px;color:var(--tvs-text-muted);">0/0 done</div></div>';
}

async function wsNewTask() {
  var title = prompt('Task title:');
  if (!title) return;
  var type = prompt('Type (business/engineering/research/operations/finance):', 'business');
  try {
    await apiFetch('/api/omega/tasks', {
      method: 'POST',
      body: JSON.stringify({ type: type || 'business', priority: 'medium', title: title })
    });
    alert('Task created!');
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

/* ── APP STORE (REAL API) ── */

        { id: 'viseron', name: 'VISERON Core', icon: '\u269B', desc: 'Superintelligence engine', installed: true },
        { id: 'atlas', name: 'ATLAS Tutor', icon: '\u{1F393}', desc: 'English learning with voice', installed: true },
        { id: 'agency', name: 'Agency Suite', icon: '\u{1F4CA}', desc: 'Marketing automation', installed: true },
        { id: 'cosmos', name: 'Cosmos Tokens', icon: '\u{1F48E}', desc: 'VSR/TRIN token management', installed: true },
        { id: 'rcs', name: 'RCS Messaging', icon: '\u{1F4AC}', desc: 'Brand messaging via Twilio', installed: false },
        { id: 'composio', name: 'Composio Bridge', icon: '\u{1F50C}', desc: 'External app integrations', installed: false },
        { id: 'aiox', name: 'AIOX Squad', icon: '\u{1F6E1}', desc: 'Supervision and audit', installed: true }
      ];
    }
    body.innerHTML =
      '<h3 style="font-size:var(--tvs-text-lg);font-weight:700;color:var(--tvs-purple);margin-bottom:var(--tvs-space-3);">App Store</h3>' +
      '<input class="tvs-input" placeholder="Search apps..." style="margin-bottom:var(--tvs-space-3);font-size:12px;" oninput="filterStore(this.value)">' +
      '<div id="storeList">' +
      apps.map(function(a) {
        var btnLabel = a.installed ? 'Open' : 'Install';
        var btnClass = a.installed ? 'tvs-btn-secondary' : 'tvs-btn-primary';
        return '<div class="store-card" data-name="' + esc(a.name.toLowerCase()) + '"><div class="store-icon">' + (a.icon || '\u{1F4E6}') + '</div>' +
          '<div class="store-info"><div class="store-name">' + esc(a.name) + '</div><div class="store-desc">' + esc(a.desc || '') + '</div></div>' +
          '<button class="tvs-btn ' + btnClass + ' tvs-btn-sm" onclick="storeAction(\'' + (a.id || a.name) + '\',\'' + btnLabel + '\')">' + btnLabel + '</button></div>';
      }).join('') + '</div>';
  } catch(e) {
    body.innerHTML = '<div style="color:var(--tvs-danger);">Error loading store</div>';
  }
}

function filterStore(q) {
  var cards = document.querySelectorAll('.store-card');
  cards.forEach(function(c) {
    c.style.display = c.dataset.name.indexOf(q.toLowerCase()) >= 0 ? '' : 'none';
  });
}

async function storeAction(id, action) {
  if (action === 'Install') {
    try {
      await apiFetch('/api/os/store/install', { method: 'POST', body: JSON.stringify({ appId: id }) });
      alert('Installed!');
    } catch(e) { alert('Error: ' + e.message); }
  } else {
    // Open app
    var appMap = { jarvis: 'jarvis', viseron: 'viseron', atlas: 'atlas', agency: 'agency', cosmos: 'crypto' };
    openApp(appMap[id] || 'browser');
  }
}

    '<iframe id="browserFrame" src="https://www.trinnityviseronsystem.io" style="width:100%;height:calc(100% - 40px);border:none;"></iframe>';

function browserNavigate() {
  var url = document.getElementById('browserUrl').value;
  if (!url.startsWith('http')) url = 'https://' + url;
  document.getElementById('browserFrame').src = url;
}

/* ── Helpers ── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatUptime() {
  var s = Math.floor((Date.now() - performance.timeOrigin) / 1000);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  return h + 'h ' + m + 'm';
}

/* ── Clock ── */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2, '0');
  var m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('trayClock').textContent = h + ':' + m;
}
setInterval(updateClock, 10000);
updateClock();

/* ── Close start menu on outside click ── */
document.addEventListener('click', function(e) {
  if (startMenuOpen && !e.target.closest('.start-menu') && !e.target.closest('.start-btn')) {
    startMenuOpen = false;
    document.getElementById('startMenu').classList.remove('open');
  }
});

/* ── Keyboard shortcut ── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && startMenuOpen) {
    startMenuOpen = false;
    document.getElementById('startMenu').classList.remove('open');
  }
});

renderDesktopIcons();
