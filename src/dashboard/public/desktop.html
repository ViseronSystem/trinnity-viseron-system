<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TVS Desktop — AI-Native Operating System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#050510; --panel:#0c0c1d; --panel2:#12122a; --line:#1e1e3f; --neon:#00f0ff; --neon2:#bf5af2; --ok:#22d38a; --warn:#ffb020; --crit:#ff4d5e; --text:#d7d7e6; --dim:#8a8aa8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(5,5,16,.92); backdrop-filter:blur(8px); z-index:10; }
  .brand { font-weight:800; font-size:17px; letter-spacing:.5px; }
  .brand span { color:var(--neon); }
  .muted { color:var(--dim); font-size:12px; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:11px; font-weight:600; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.warn { color:var(--warn); border-color:var(--warn); }
  .badge.crit { color:var(--crit); border-color:var(--crit); }
  .dock { display:flex; gap:6px; flex-wrap:wrap; padding:10px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .dock button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer; font-family:'Inter'; font-size:13px; }
  .dock button:hover, .dock button.active { border-color:var(--neon); color:var(--neon); }
  main { display:grid; grid-template-columns:1fr; gap:16px; padding:18px 22px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:900px){ .grid { grid-template-columns:repeat(2,1fr); } .full { grid-column:1/-1; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h3 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--neon); margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--dim); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .st { padding:2px 8px; border-radius:99px; font-size:10.5px; font-weight:700; }
  .st.RUNNING,.st.granted { background:rgba(34,211,138,.15); color:var(--ok); }
  .st.COMPLETED,.st.ok { background:rgba(0,240,255,.12); color:var(--neon); }
  .st.FAILED,.st.denied { background:rgba(255,77,94,.15); color:var(--crit); }
  .st.TIMEOUT,.st.warn { background:rgba(255,176,32,.15); color:var(--warn); }
  .st.KILLED { background:rgba(138,138,168,.2); color:var(--dim); }
  input, select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:13px; }
  button.act { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12px; }
  button.act:hover { border-color:var(--neon); color:var(--neon); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; font-size:12.5px; }
  .kv b { color:var(--neon2); font-weight:600; }
  .kv div:nth-child(odd) { color:var(--dim); }
  pre { background:#070712; border:1px solid var(--line); border-radius:8px; padding:10px; font-family:'JetBrains Mono'; font-size:11.5px; overflow:auto; max-height:240px; white-space:pre-wrap; }
  .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,var(--neon),var(--neon2)); }
  #toast { position:fixed; bottom:18px; right:18px; background:var(--panel2); border:1px solid var(--neon); color:var(--text); padding:10px 16px; border-radius:10px; font-size:12.5px; opacity:0; transition:opacity .25s; z-index:99; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="brand">TVS <span>DESKTOP</span> <span class="muted" id="osver"></span></div>
  <div class="row" style="margin:0">
    <span class="badge ok" id="health">health</span>
    <span class="muted mono" id="uptime"></span>
    <a href="/" class="act" style="text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:7px;color:var(--dim)">← Site</a>
  </div>
</header>

<div class="dock" id="dock">
  <button data-view="monitor" class="active">System Monitor</button>
  <button data-view="processes">Process Manager</button>
  <button data-view="files">File Explorer</button>
  <button data-view="store">App Store</button>
  <button data-view="agents">Agent Manager</button>
  <button data-view="security">Security Center</button>
</div>

<main id="main"></main>
<div id="toast"></div>

<script>
const $ = (sel) => document.querySelector(sel);
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (path, opts) => {
  const r = await fetch('/api/os' + path, opts ?? {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
};
const ST = (s) => `<span class="st ${esc(s)}">${esc(s)}</span>`;

async function loadStatus() {
  try {
    const d = await api('/status');
    $('#osver').textContent = `v${d.version}`;
    $('#uptime').textContent = `uptime ${Math.floor(d.uptimeMs/60000)}m`;
    $('#health').textContent = d.watchdog?.enabled ? 'SELF-HEAL ON' : 'health';
    return d;
  } catch { $('#health').textContent = 'offline'; $('#health').className = 'badge crit'; return null; }
}

function viewMonitor(d) {
  const p = d.processes, k = d.kernel;
  const total = p.total || 0;
  const pct = total ? Math.round((p.running / total) * 100) : 0;
  return `
  <section class="grid full">
    <div class="card full">
      <h3>TVS OS — System Monitor</h3>
      <div class="kv">
        <div>Kernel</div><b>${k ? esc(k.name) + ' v' + esc(k.version) : '—'}</b>
        <div>Runtime Agents</div><b>${d.agents ? d.agents.loaded : '—'}</b>
        <div>Watchdog</div><b>${d.watchdog ? d.watchdog.targets.length + ' alvos · stale ' + Math.round(d.watchdog.staleMs/1000) + 's' : 'off'}</b>
        <div>App Store</div><b>${d.store.catalog} apps · ${d.store.installed} instalados</b>
        <div>Processos</div><b>${total} total · ${p.running} running</b>
        <div>Audit Logs</div><b>${d.security.auditCount} entradas</b>
      </div>
      <div class="bar" style="margin-top:14px"><div style="width:${Math.max(4,pct)}%"></div></div>
    </div>
  </section>
  <section class="grid">
    <div class="card">
      <h3>Kernel Services</h3>
      <table><tbody>
        <tr><td>Event Bus</td><td class="mono">${k ? k.events.totalEmitted + ' emitidos' : '—'}</td></tr>
        <tr><td>Task Queue</td><td class="mono">${k ? k.tasks.total + ' tasks' : '—'}</td></tr>
        <tr><td>Agents ativos</td><td class="mono">${k ? k.agents.active + '/' + k.agents.total : '—'}</td></tr>
        <tr><td>Roles</td><td class="mono">${k ? k.roles.join(', ') : '—'}</td></tr>
      </tbody></table>
    </div>
    <div class="card">
      <h3>Doctor (Package Manager)</h3>
      <pre id="doctorPre">correr 'tvs doctor' …</pre>
    </div>
  </section>`;
}

function viewProcesses() {
  return `
  <section class="card full">
    <h3>Process Manager</h3>
    <div class="row">
      <select id="pmAgent"></select>
      <input id="pmTask" placeholder="tarefa do agente…" style="flex:1" value="Executa a tua função principal e reporta." />
      <button class="act" onclick="spawnProc()">▶ Spawn</button>
      <button class="act" onclick="refreshProcesses()">↻</button>
    </div>
    <div id="procTable"><pre>carregar…</pre></div>
  </section>`;
}
async function spawnProc() {
  try {
    const proc = await api('/processes/spawn', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ agentId: $('#pmAgent').value, task: $('#pmTask').value }) });
    toast('spawned PID ' + proc.pid + ' · ' + proc.agentName);
    refreshProcesses();
  } catch (e) { toast('erro: ' + e.message); }
}
async function killProc(pid) { try { await api('/processes/' + pid + '/kill', { method:'POST' }); toast('PID ' + pid + ' terminado'); refreshProcesses(); } catch (e) { toast(e.message); } }
async function refreshProcesses() {
  try {
    const d = await api('/processes');
    $('#pmAgent').innerHTML = (await api('/status')).agents ? (await agentsList()).map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('') : '';
    $('#procTable').innerHTML = `<table><thead><tr><th>PID</th><th>Agente</th><th>Tarefa</th><th>Estado</th><th>Duração</th><th></th></tr></thead><tbody>`
      + (d.processes.length ? d.processes.map(p => `<tr><td class="mono">${p.pid}</td><td>${esc(p.agentName)} <span class="muted">${esc(p.agentId)}</span></td><td class="mono" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.task)}</td><td>${ST(p.status)}</td><td class="mono">${p.durationMs ? Math.round(p.durationMs/1000)+'s' : '…'}</td><td>${p.status==='RUNNING'?`<button class="act" onclick="killProc(${p.pid})">✕</button>`:''}</td></tr>`).join('')
      : '<tr><td colspan="6" class="muted">sem processos — spawna um agente acima</td></tr>') + '</tbody></table>';
  } catch (e) { $('#procTable').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}
async function agentsList() {
  const o = await api('/status');
  return o.agents?.specs ?? [];
}

function viewFiles() {
  return `
  <section class="card full">
    <h3>File Explorer — TVS Virtual FS</h3>
    <div class="row">
      <input id="fsPath" value="/" style="flex:1" class="mono" />
      <button class="act" onclick="lsDir()">Listar</button>
      <button class="act" onclick="readFile()">Ler</button>
    </div>
    <div id="fsOut"><pre>carregar…</pre></div>
  </section>`;
}
async function lsDir() {
  try {
    const d = await api('/fs/list?path=' + encodeURIComponent($('#fsPath').value));
    $('#fsOut').innerHTML = `<table><thead><tr><th>Nome</th><th>Tipo</th><th>Tamanho</th></tr></thead><tbody>`
      + d.entries.map(e => `<tr><td class="mono">${esc(e.name)}${e.type==='dir'?'/':''}</td><td>${esc(e.type)}</td><td class="mono">${e.size ?? ''}</td></tr>`).join('') + '</tbody></table>';
  } catch (e) { $('#fsOut').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}
async function readFile() {
  try {
    const d = await api('/fs/read?path=' + encodeURIComponent($('#fsPath').value));
    $('#fsOut').innerHTML = `<pre>${esc(d.content)}</pre>`;
  } catch (e) { $('#fsOut').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}

function viewStore() {
  return `<section class="card full"><h3>App Store — Apps + Agents + Skills</h3>
    <div class="row"><select id="storeKind"><option value="">Tudo</option><option>agent</option><option>squad</option><option>module</option></select>
    <button class="act" onclick="refreshStore()">↻</button></div><div id="storeOut"><pre>carregar…</pre></div></section>`;
}
async function refreshStore() {
  try {
    const kind = $('#storeKind').value;
    const d = await api('/store' + (kind ? '?kind=' + kind : ''));
    $('#storeOut').innerHTML = `<table><thead><tr><th>App</th><th>Categoria</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>`
      + d.apps.map(a => `<tr><td><b>${esc(a.name)}</b><div class="muted">${esc(a.id)}</div></td><td>${esc(a.category)}</td><td class="mono">${esc(a.kind)}</td><td>${a.installed?'<span class="st COMPLETED">instalado</span>':'<span class="st TIMEOUT">catálogo</span>'}</td><td><button class="act" onclick="${a.installed?`uninstallApp('${esc(a.id)}')`:`installApp('${esc(a.id)}')`}">${a.installed?'Desinstalar':'Instalar'}</button></td></tr>`).join('')
      + '</tbody></table>';
  } catch (e) { $('#storeOut').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}
async function installApp(id) { try { await api('/store/install', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); toast(id + ' instalado'); refreshStore(); } catch (e) { toast(e.message); } }
async function uninstallApp(id) { try { await api('/store/uninstall', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); toast(id + ' desinstalado'); refreshStore(); } catch (e) { toast(e.message); } }

function viewAgents() {
  return `<section class="card full"><h3>Agent Manager — Runtime de Agentes</h3><div id="agentOut"><pre>carregar…</pre></div></section>`;
}
async function refreshAgents() {
  try {
    const o = await api('/status');
    const a = o.agents?.specs ?? [];
    $('#agentOut').innerHTML = `<table><thead><tr><th>Agente</th><th>Role</th><th>Estado</th><th></th></tr></thead><tbody>`
      + a.map(x => `<tr><td><b>${esc(x.name)}</b><div class="muted mono">${esc(x.id)}</div></td><td>${esc(x.role)}</td><td>${ST(x.status)}</td><td><button class="act" onclick="spawnFromAgent('${esc(x.id)}')">Executar</button></td></tr>`).join('')
      + '</tbody></table>';
  } catch (e) { $('#agentOut').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}
async function spawnFromAgent(id) {
  $('#pmAgent').value = id;
  document.querySelector('[data-view="processes"]').click();
  spawnProc();
}

function viewSecurity() {
  return `<section class="grid full">
    <div class="card"><h3>Security Center</h3><div id="secOut"><pre>carregar…</pre></div></div>
    <div class="card"><h3>Audit Log</h3><div id="auditOut"><pre>carregar…</pre></div></div>
  </section>`;
}
async function refreshSecurity() {
  try {
    const s = await api('/security');
    $('#secOut').innerHTML = `<div class="kv"><div>Roles</div><b>${esc(s.roles.join(', '))}</b><div>Audit Count</div><b>${s.auditCount}</b><div>Último evento</div><b class="mono">${s.lastEvent ? new Date(s.lastEvent).toLocaleTimeString() : '—'}</b></div>`;
    $('#auditOut').innerHTML = `<table><thead><tr><th>Actor</th><th>Ação</th><th>Resultado</th><th>Hora</th></tr></thead><tbody>`
      + s.recent.map(e => `<tr><td class="mono">${esc(e.actor)}</td><td class="mono">${esc(e.action)}</td><td>${ST(e.result)}</td><td class="mono">${new Date(e.ts).toLocaleTimeString()}</td></tr>`).join('')
      + '</tbody></table>';
  } catch (e) { $('#secOut').innerHTML = '<pre>' + esc(e.message) + '</pre>'; }
}

async function runDoctor() {
  try { const d = await api('/pkg/doctor'); $('#doctorPre').textContent = JSON.stringify(d, null, 2); } catch (e) { $('#doctorPre').textContent = e.message; }
}

const VIEWS = { monitor: loadStatus, processes: refreshProcesses, files: lsDir, store: refreshStore, agents: refreshAgents, security: refreshSecurity };

document.querySelectorAll('.dock button').forEach(btn => btn.addEventListener('click', async () => {
  document.querySelectorAll('.dock button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const view = btn.dataset.view;
  $('#main').innerHTML = ({ monitor: viewMonitor, processes: viewProcesses, files: viewFiles, store: viewStore, agents: viewAgents, security: viewSecurity })[view] ? '' : 'carregar…';
  if (view === 'monitor') { const d = await loadStatus(); $('#main').innerHTML = viewMonitor(d ?? {processes:{},kernel:null}); if (d) runDoctor(); }
  else { $('#main').innerHTML = ({ processes: viewProcesses, files: viewFiles, store: viewStore, agents: viewAgents, security: viewSecurity })[view](); VIEWS[view](); }
}));

(async () => {
  const d = await loadStatus();
  $('#main').innerHTML = viewMonitor(d ?? {processes:{},kernel:null});
  if (d) runDoctor();
})();
</script>
</body>
</html>
