version: '3.8'

services:
  tvs-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvs-core-system
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
      - N8N_HOST=http://n8n:5678
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    restart: always
    depends_on:
      - ollama
      - qdrant
      - n8n

  ollama:
    image: ollama/ollama:latest
    container_name: tvs-ollama-local
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tvs-qdrant-vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  n8n:
    image: n8nio/n8n:latest
    container_name: tvs-n8n-automation
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-viseron}
    volumes:
      - n8n_storage:/home/node/.n8n
    restart: always

volumes:
  ollama_storage:
  qdrant_storage:
  n8n_storage:
