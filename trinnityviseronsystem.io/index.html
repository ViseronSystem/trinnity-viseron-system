<style>
:root{--bg:#02020a;--panel:rgba(8,10,24,.92);--line:rgba(0,240,255,.14);--cyan:#00f0ff;--purple:#bf5af2;--orange:#ff9f0a;--green:#00ff87;--red:#ff5f57;--text:#e6e8f4;--muted:#8a90ab;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh}
canvas#bgstars{position:fixed;inset:0;z-index:0}
/* BOOT */
#boot{position:fixed;inset:0;background:#010108;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono)}
#boot .logo{font-family:'Orbitron';font-weight:900;font-size:2.1rem;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 30px rgba(0,240,255,.6)}
#boot .logo i{color:var(--purple);font-style:normal}
#boot .sub{color:var(--muted);font-size:.8rem;margin-top:6px;letter-spacing:3px}
#boot .log{margin-top:34px;width:min(480px,86vw);font-size:.72rem;color:var(--muted);line-height:1.9;min-height:180px;text-align:left}
#boot .log .ok{color:var(--green)} #boot .log .w{color:var(--orange)}
#boot .bar{width:min(480px,86vw);height:6px;background:rgba(255,255,255,.07);border-radius:99px;margin-top:18px;overflow:hidden}
#boot .bar div{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .4s}
/* DESKTOP */
#desktop{position:fixed;inset:0;z-index:1;display:none}
#wallpaper{position:absolute;inset:0}
#icons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:10px;z-index:5}
.dicon{width:86px;padding:10px 6px;text-align:center;cursor:pointer;border-radius:10px;transition:.15s;background:rgba(0,0,0,.25)}
.dicon:hover{background:rgba(0,240,255,.12);box-shadow:0 0 18px rgba(0,240,255,.15)}
.dicon .ico{font-size:1.7rem}
.dicon .nm{font-size:.68rem;color:var(--text);margin-top:5px;text-shadow:0 1px 4px #000}
/* VENTANAS */
.win{position:absolute;min-width:320px;min-height:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 40px rgba(0,240,255,.05);display:none;flex-direction:column;overflow:hidden;backdrop-filter:blur(18px)}
.win.open{display:flex}
.win.max{inset:0!important;width:100%!important;height:100%!important;border-radius:0}
.win .tbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(0,240,255,.05);border-bottom:1px solid var(--line);cursor:move;user-select:none}
.win .tbar .ttl{font-family:'Orbitron';font-size:.72rem;font-weight:700;letter-spacing:1px;color:var(--cyan);flex:1}
.win .tbar button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:2px 8px;border-radius:6px;font-family:var(--mono)}
.win .tbar button:hover{background:rgba(255,255,255,.1);color:var(--text)}
.win .tbar button.cl:hover{background:var(--red);color:#fff}
.win .body{flex:1;overflow:auto;padding:14px 16px}
/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:none;align-items:center;gap:8px;padding:8px 12px;background:rgba(4,6,16,.88);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#taskbar .tbtn{background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.14);color:var(--text);border-radius:8px;padding:7px 14px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:7px}
#taskbar .tbtn.on{background:rgba(0,240,255,.18);border-color:var(--cyan);color:var(--cyan)}
#clock{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--cyan)}
/* TERMINAL */
.term{font-family:var(--mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--green)}
.term .c{color:var(--cyan)} .term .e{color:var(--red)} .term .w{color:var(--orange)} .term .m{color:var(--muted)}
.term .in{display:flex;gap:8px;align-items:center}
.term input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:.8rem;caret-color:var(--cyan)}

table.g{width:100%;border-collapse:collapse;font-size:.78rem}

.bg{background:rgba(0,255,135,.15);color:var(--green)} .by{background:rgba(255,159,10,.15);color:var(--orange)} .br{background:rgba(255,95,87,.15);color:var(--red)} .bp{background:rgba(191,90,242,.15);color:var(--purple)}
.chip{display:inline-block;background:rgba(0,240,255,.08);border:1px solid var(--line);color:var(--cyan);border-radius:99px;padding:4px 12px;font-size:.72rem;margin:3px;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.misiones .m{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.misiones .m.done{border-color:rgba(0,255,135,.4);background:rgba(0,255,135,.05)}
.misiones .m h5{font-size:.82rem}
.misiones .m p{font-size:.72rem;color:var(--muted);flex:1}
.misiones .m .row{display:flex;justify-content:space-between;font-size:.7rem}
.misiones .m .trin{color:var(--green);font-weight:700}
.misiones .m button{background:rgba(0,240,255,.12);border:1px solid rgba(0,240,255,.35);color:var(--cyan);border-radius:7px;padding:7px;font-weight:800;font-size:.72rem;cursor:pointer}
.misiones .m button.ok{background:rgba(0,255,135,.12);border-color:rgba(0,255,135,.4);color:var(--green);cursor:default}

.filtros button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:.68rem;cursor:pointer}

.prog div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:.4s}
.mon{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.arbol .d{color:var(--cyan)} .arbol .f{color:var(--muted)}

<script>
/* ============ STARFIELD REALISTA ============ */
(function(){
  var c=document.getElementById('bgstars'),x=c.getContext('2d'),W,H,stars=[],neb=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;stars=[];for(var i=0;i<380;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1+0.15,r:Math.random()*1.4+0.3,h:Math.random()<0.12});}
  rs();addEventListener('resize',rs);
  function nube(cx,cy,r,c1,c2){var g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c1);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);}
  var t=0;
  function loop(){
    t+=0.0025;x.clearRect(0,0,W,H);
    nube(W*0.22+Math.sin(t*0.6)*30,H*0.3,r=220,'rgba(0,120,190,0.05)');
    nube(W*0.75+Math.cos(t*0.5)*40,H*0.62,280,'rgba(120,40,220,0.05)');
    nube(W*0.5,H*0.8,300,'rgba(255,90,10,0.03)');
    x.fillStyle='rgba(255,255,255,.9)';
    for(var i=0;i<stars.length;i++){var s=stars[i];s.z-=0.0018;if(s.z<=0.05){s.z=1;s.x=Math.random()*W;s.y=Math.random()*H;}
      var px=(s.x-W/2)/s.z+W/2,py=(s.y-H/2)/s.z+H/2;if(px<0||px>W||py<0||py>H)continue;
      x.globalAlpha=Math.min(1,(1-s.z)*1.2);x.beginPath();x.arc(px,py,s.r/s.z,0,6.29);x.fill();
      if(s.h){x.strokeStyle='rgba(150,220,255,'+Math.min(0.5,(1-s.z))+')';x.lineWidth=1;x.beginPath();x.moveTo(px-8/s.z,py+6/s.z);x.lineTo(px,py);x.stroke();}}
    x.globalAlpha=1;
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ============ GESTOR DE VENTANAS ============ */
var winsEl=document.getElementById('wins'),taskbar=document.getElementById('taskbar'),wins={},zTop=100;
function abrirWin(id,titulo,ico,html,geo){
  geo=geo||{x:120+Object.keys(wins).length*36,y:90+Object.keys(wins).length*28,w:640,h:460};
  if(wins[id]){focoWin(id);return;}
  var w=document.createElement('div');w.className='win open';w.id='win-'+id;
  w.style.cssText='left:'+geo.x+'px;top:'+geo.y+'px;width:'+geo.w+'px;height:'+geo.h+'px;z-index:'+(++zTop);
  w.innerHTML='<div class="tbar"><span class="ttl">'+ico+' '+titulo+'</span>'+
    '<button onclick="minWin(\''+id+'\')">&#8211;</button>'+
    '<button onclick="maxWin(\''+id+'\')">&#9744;</button>'+
    '<button class="cl" onclick="cerrarWin(\''+id+'\')">&#10005;</button></div>'+
    '<div class="body">'+html+'</div>';
  winsEl.appendChild(w);wins[id]=w;
  var tb=document.createElement('button');tb.className='tbtn on';tb.id='tb-'+id;
  tb.innerHTML=ico+' '+titulo;tb.onclick=function(){focoWin(id);};
  var clock=document.getElementById('clock');taskbar.insertBefore(tb,clock);
  dragWin(w);
  return w;
}
function focoWin(id){var w=wins[id];if(!w)return;w.style.display='flex';w.classList.remove('max');w.style.zIndex=++zTop;
  var t=document.getElementById('tb-'+id);document.querySelectorAll('.tbtn').forEach(function(b){b.classList.remove('on')});if(t)t.classList.add('on');}
function minWin(id){wins[id].style.display='none';var t=document.getElementById('tb-'+id);if(t)t.classList.remove('on');}
function maxWin(id){var w=wins[id];w.classList.toggle('max');}
function cerrarWin(id){var w=wins[id];if(w)w.remove();delete wins[id];var t=document.getElementById('tb-'+id);if(t)t.remove();}
function dragWin(w){
  var tb=w.querySelector('.tbar'),ox,oy;
  tb.addEventListener('mousedown',function(e){if(e.target.tagName==='BUTTON')return;if(w.classList.contains('max'))return;
    ox=e.clientX-w.offsetLeft;oy=e.clientY-w.offsetTop;
    function mv(ev){w.style.left=(ev.clientX-ox)+'px';w.style.top=Math.max(0,ev.clientY-oy)+'px';}
    function up(){removeEventListener('mousemove',mv);removeEventListener('mouseup',up);}
    addEventListener('mousemove',mv);addEventListener('mouseup',up);});
}

function termPrint(s,cls){var o=document.getElementById('termOut');if(!o)return;var d=document.createElement('div');d.className=cls||'';d.innerHTML=s||' ';o.appendChild(d);o.parentElement.scrollTop=9e9;}
function termPrompt(){var p=document.getElementById('termPrompt');if(p)p.textContent=(aliasUser||'viseron')+'@tvs:~$';}
function updatePrompt(){termPrompt();}
function ejecutar(cmd){
  var c=cmd.trim();termPrint('<span class="p">'+((aliasUser||'viseron')+'@tvs:~$</span> '+(c||'')),'');
  var a=c.toLowerCase().split(/\s+/),base=a[0],args=a.slice(1);
  var out={
   help:function(){termPrint('<span class="c">COMANDOS DISPONIBLES</span>\n  whoami · status · version · agentes · skills · trabajadores · tareas\n  misiones · juegos · tokens · roadmap · arbol · github · auditoria\n  firma · cosmos · alias &lt;nombre&gt; · fecha · limpiar · reiniciar · salir');},
   whoami:function(){termPrint('TVS OS v5.0 — '+ESTADO.server+'\nRol: <span class="c">Comandante de la nave</span> · Misiones: '+(misionesHechas().length)+'/50 · TRIN: '+trinTotal());},
   status:function(){termPrint('<span class="c">ESTADO DEL BATALLON</span>');for(var k in ESTADO){termPrint('  '+k+': <span class="w">'+ESTADO[k]+'</span>');}},
   version:function(){termPrint('TVS OS v5.0 · AIOX '+ESTADO.version+' · Node '+ESTADO.node);},
   fecha:function(){termPrint(new Date().toLocaleString('es-ES'));},
   agentes:function(){termPrint('<span class="c">12 SQUADS ACTIVAS</span>');AGENTES.forEach(function(a){termPrint('  ['+(a.activo?'<span class="w">ON</span>':'OFF')+'] '+a.id+' — '+a.rol);});},
   skills:function(){termPrint('<span class="c">'+SKILLS.length+' SKILLS</span>\n  '+SKILLS.join(' · '));},
   trabajadores:function(){termPrint('199 workers registrados en el registry (ver manifiesto workers.csv)');},
   tareas:function(){termPrint('215 tareas en development/tasks (ver manifiesto tasks.csv)');},
   manifests:function(){termPrint('manifests: agents.csv=12 · workers.csv=199 · tasks.csv=215 — <span class="ok" style="color:#00ff87">VALIDOS</span>');},
   misiones:function(){var m=misionesHechas();termPrint('Misiones cumplidas: <span class="c">'+m.length+'/50</span> · TRIN acumulados: <span class="c">'+trinTotal()+'</span>\nAbre la app Misiones para continuar.');},
   juegos:function(){termPrint('3 juegos: Asteroid Miner · Cosmos Runner · Quiz del Batallon\nEjecuta `abrir juegos` para saltar a la sala.');},
   tokens:function(){TOKENS.forEach(function(t){termPrint('<span class="c">'+t.s+'</span> — '+t.n+' ('+t.tipo+')\n  supply '+t.supply+' · '+t.mec+'\n  redes: '+t.redes);});},
   roadmap:function(){ROADMAP.forEach(function(r){termPrint('<span class="w">FASE '+r[0]+'</span> '+r[1]+' — '+r[2]);});},
   arbol:function(){termPrint('<span class="c">ARBOL DEL PROYECTO</span>');ARBOL.forEach(function(n){termPrint('<span class="'+(n[0]==='d'?'c':'m')+'">'+n[1]+'</span>');});},
   explorar:function(){abrirApp('explorador');termPrint('Explorador abierto.');},
   github:function(){window.open('https://github.com/ViseronSystem/trinnity-viseron-system','_blank');termPrint('Abriendo repositorio en GitHub...');},
   auditoria:function(){termPrint('<span class="c">AUDITORIA 17/08/2026</span>\n  Framework: <span class="w">VERDE</span> · Manifests: <span class="w">VERDE</span> · Squads: <span class="w">VERDE (7 IDEs)</span>\n  n8n: <span class="w">VERDE</span> · Docker: <span class="w">AMARILLO (virt anidada)</span>\n  Seguridad: <span class="e">P0 pendiente (rotar clave + usuario n8n)</span>');},
   firma:function(){termPrint('<span class="c">TVS — AUTORIDAD</span>\n  Pedro Costa — Comandante\n  Trinnity Hurtado — Reina\n  Decisiones finales: ellos. © 2026.');},
   cosmos:function(){location.href='cosmos.html';},
   alias:function(){if(args[0]){aliasUser=args[0];termPrint('Alias establecido: <span class="c">'+args[0]+'</span>');updatePrompt();}else termPrint('Uso: alias &lt;nombre&gt;');},
   abrir:function(){if(args[0])abrirApp(args[0]);else termPrint('Uso: abrir &lt;app&gt;');},
   limpiar:function(){var o=document.getElementById('termOut');if(o)o.innerHTML='';},
   reiniciar:function(){location.reload();},
   salir:function(){cerrarWin('terminal');},
   pedro:function(){termPrint('El Comandante observa. Las misiones continuan.');},
   trinnity:function(){termPrint('La Reina observa. El cosmos os protege.');},
   viseron:function(){termPrint('<span class="c">5000+ mentes conectadas. PoM activa.</span>');}

  if(out[base]){out[base]();}

  else{termPrint('<span class="e">comando no reconocido: '+base+'</span>\nEscribe <span class="c">help</span> para la lista de comandos.');}

function bindTerm(){var inp=document.getElementById('termIn');if(!inp)return;inp.focus();

}

function dibujarMon(cvId,color,base,amp){
  var cv=document.getElementById(cvId);if(!cv)return;
  cv.width=cv.clientWidth*2;cv.height=110*2;
  var x=cv.getContext('2d'),datos=[];
  for(var i=0;i<60;i++)datos.push(base);
  function paso(){
    var ult=datos[datos.length-1];var n=Math.max(0,Math.min(1,ult+(Math.random()-0.5)*0.25+((base-ult)*0.05)));
    datos.push(n);datos.shift();
    x.clearRect(0,0,cv.width,cv.height);
    x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;
    for(var g=0;g<4;g++){x.beginPath();x.moveTo(0,g*cv.height/4);x.lineTo(cv.width,g*cv.height/4);x.stroke();}
    x.beginPath();
    for(var i=0;i<datos.length;i++){var px=i/datos.length*cv.width,py=cv.height-(datos[i]*amp+0.2)*cv.height;if(i===0)x.moveTo(px,py);else x.lineTo(px,py);}
    x.strokeStyle=color;x.lineWidth=3;x.shadowColor=color;x.shadowBlur=8;x.stroke();
  }
  paso();
  var id=setInterval(paso,600);
  return id;
}

var CATS=["Todas","Génesis","Exploración","Construcción","Cosmos","Comunidad","Cripto"];
function misionesLS(){try{return JSON.parse(localStorage.getItem('tvs_misiones')||'[]')}catch(e){return[]}}
function guardarMisiones(a){localStorage.setItem('tvs_misiones',JSON.stringify(a))}
function misionesHechas(){return misionesLS()}
function trinTotal(){return MISIONES.filter(function(m){return misionesLS().indexOf(m[0])>=0}).reduce(function(s,m){return s+m[4]},0)}
function misionesHTML(){
  var h='<div class="prog"><div style="font-size:.72rem;color:var(--muted)" id="mpg">progreso</div><div class="bar" style="height:8px;background:rgba(255,255,255,.07);border-radius:99px"><div id="mfill"></div></div></div>';
  h+='<div class="filtros">'+CATS.map(function(c,i){return '<button data-c="'+c+'" class="'+(i===0?'on':'')+'">'+c+'</button>'}).join('')+'</div>';
  h+='<div class="grid2 misiones" id="mgrid"></div>';
  return h;
}
function pintarMisiones(cat){
  var g=document.getElementById('mgrid');if(!g)return;
  var hechas=misionesLS();var filt=MISIONES.filter(function(m){return cat==='Todas'||m[1]===cat});
  g.innerHTML='';
  filt.forEach(function(m){
    var done=hechas.indexOf(m[0])>=0;
    var d=document.createElement('div');d.className='m'+(done?' done':'');
    d.innerHTML='<div class="row"><span style="color:var(--purple);font-family:var(--mono)">'+m[0]+'</span><span style="color:var(--orange)">'+('&#9733;'.repeat(m[3]))+'</span></div>'+
      '<h5>'+m[2]+'</h5><p>'+m[2]+' — '+m[1]+'</p>'+
      '<div class="row"><span>Dificultad '+m[3]+'/5</span><span class="trin">+'+m[4]+' TRIN</span></div>'+
      '<button class="'+(done?'ok':'')+'">'+(done?'&#10003; CUMPLIDA':'CUMPLIR MISION')+'</button>';
    d.querySelector('button').onclick=function(){
      if(done)return;
      var arr=misionesLS();arr.push(m[0]);guardarMisiones(arr);
      pintarMisiones(cat);pintarProgreso();
      if(aliasUser!==null){} 
    };
    g.appendChild(d);
  });
  pintarProgreso();
}
function pintarProgreso(){
  var hechas=misionesLS();
  var p=document.getElementById('mpg');if(p)p.textContent=hechas.length+' de 50 misiones cumplidas · '+trinTotal()+' TRIN';
  var f=document.getElementById('mfill');if(f){f.style.background='linear-gradient(90deg,var(--cyan),var(--green))';f.style.width=(hechas.length/50*100)+'%';f.style.height='100%';}
}
function bindMisiones(){
  var g=document.getElementById('mgrid');if(!g)return;
  pintarMisiones('Todas');
  document.querySelectorAll('#win-misiones .filtros button').forEach(function(b){
    b.onclick=function(){document.querySelectorAll('#win-misiones .filtros button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');pintarMisiones(b.dataset.c);};
