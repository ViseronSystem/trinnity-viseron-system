<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVS Games — Sala de Juegos del Cosmos</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02020a;--cyan:#00f0ff;--purple:#bf5af2;--orange:#ff9f0a;--green:#00ff87;--red:#ff5f57;--text:#e6e8f4;--muted:#8a90ab}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
h1{font-family:'Orbitron';font-weight:900;letter-spacing:2px;font-size:1.6rem;text-align:center}
h1 i{color:var(--purple);font-style:normal} h1 b{color:var(--cyan)}
.sub{color:var(--muted);font-size:.8rem;margin:8px 0 22px;text-align:center}
.menu{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.menu button{background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.25);color:var(--muted);border-radius:99px;padding:9px 20px;font-size:.8rem;font-weight:800;cursor:pointer;transition:.2s;font-family:'Orbitron';letter-spacing:1px}
.menu button.on{background:rgba(0,240,255,.18);color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 18px rgba(0,240,255,.25)}
.panel{width:min(920px,96vw);background:rgba(8,10,24,.92);border:1px solid rgba(0,240,255,.15);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
canvas.game{width:100%;border-radius:10px;border:1px solid rgba(0,240,255,.18);background:radial-gradient(ellipse at 50% 30%,#0a1030,#02020a);display:block}
.hud{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;font-family:'JetBrains Mono',monospace;font-size:.8rem}
.hud .k{color:var(--muted)} .hud .v{color:var(--cyan);font-weight:700}
.inst{color:var(--muted);font-size:.74rem;text-align:center;margin-top:12px;line-height:1.6}
.back{position:fixed;top:14px;left:14px;color:var(--cyan);text-decoration:none;font-size:.78rem;font-weight:800;background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.3);padding:8px 14px;border-radius:99px;z-index:50}
.back:hover{background:rgba(0,240,255,.2)}
.qbox{font-family:'JetBrains Mono',monospace}
.qbox .q{font-size:1rem;margin:14px 0;color:var(--cyan)}
.qbox .opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(0,240,255,.18);color:var(--text);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:.85rem;font-family:'Inter';transition:.2s}
.qbox .opt:hover{background:rgba(0,240,255,.12);border-color:var(--cyan)}
.qbox .opt.bad{background:rgba(255,95,87,.2);border-color:var(--red)}
.qbox .opt.good{background:rgba(0,255,135,.2);border-color:var(--green)}
.final{text-align:center;padding:30px 10px}
.final .big{font-family:'Orbitron';font-size:2.2rem;font-weight:900;color:var(--green);margin:10px 0}
.final .trin{color:var(--orange);font-weight:900}
</style>
</head>
<body>
<a class="back" href="../index.html">&#8592; TVS OS</a>
<h1>TRINNITY <i>VISERON</i> <b>GAMES</b></h1>
<div class="sub">Sala de juegos del cosmos &middot; gana TRIN &middot; récords guardados en tu nave</div>
<div class="menu">
  <button id="b-minero" class="on">&#9752; ASTEROID MINER</button>
  <button id="b-runner">&#128640; COSMOS RUNNER</button>
  <button id="b-quiz">&#129302; QUIZ DEL BATALLON</button>
</div>
<div class="panel" id="panel"></div>
<div class="inst" id="inst"></div>
<script>
/* ============ INFRA COMUN ============ */
var R = {
 get:function(k,d){try{return localStorage.getItem('tvs_'+k)||d}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem('tvs_'+k,v)}catch(e){}}
};
function stars(ctx,W,H,t){
  for(var i=0;i<70;i++){
    var sx=(i*97%W), sy=((i*53)+t*((i%5)+1)*14)%H;
    ctx.globalAlpha=0.3+(i%4)*0.2;
    ctx.fillStyle=i%9===0?'#ffd9a0':'#9fd8ff';
    ctx.beginPath();ctx.arc(sx,sy,(i%3)+0.4,0,6.29);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function nebula(ctx,W,H,t){
  var g=ctx.createRadialGradient(W*0.3+Math.sin(t*0.0004)*40,H*0.4,10,W*0.3,H*0.4,260);
  g.addColorStop(0,'rgba(0,120,190,0.10)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var g2=ctx.createRadialGradient(W*0.75+Math.cos(t*0.0005)*30,H*0.7,10,W*0.75,H*0.7,240);
  g2.addColorStop(0,'rgba(150,40,220,0.10)');g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
</script>

<script>
/* ============ JUEGO 1: ASTEROID MINER ============ */
var J1={
 html:'<div class="hud"><div><span class="k">TRIN:</span> <span class="v" id="j1s">0</span></div><div><span class="k">NIVEL:</span> <span class="v" id="j1l">1</span></div><div><span class="k">VIDAS:</span> <span class="v" id="j1v">3</span></div><div><span class="k">RÉCORD:</span> <span class="v" id="j1r">0</span></div></div><canvas class="game" id="j1" width="880" height="520"></canvas>',
 inst:'&#8592;&#8594; mover nave &middot; captura asteroides de TRIN (dorados) &middot; esquiva las bombas (rojas) &middot; 3 vidas &middot; cada 15 TRIN sube el nivel',
 start:function(){
  var cv=document.getElementById('j1'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
  var nave={x:W/2,w:92,h:40},objs=[],part=[],score=0,vidas=3,nivel=1,t=0,run=true,spd=1.2;
  document.getElementById('j1r').textContent=R.get('miner','0');
  var keys={};addEventListener('keydown',function(e){keys[e.key]=true});addEventListener('keyup',function(e){keys[e.key]=false});
  function spawn(){
    var bomba=Math.random()<0.22+nivel*0.02;
    objs.push({x:Math.random()*(W-40)+20,y:-30,r:13+(bomba?4:Math.random()*14),v:spd*(0.9+Math.random()*0.8+nivel*0.12),b:bomba});
  }
  function loop(){
    if(!run)return;
    t++;x.clearRect(0,0,W,H);nebula(x,W,H,t);stars(x,W,H,t);
    if(keys['ArrowLeft'])nave.x-=7;if(keys['ArrowRight'])nave.x+=7;nave.x=clamp(nave.x,50,W-50);
    if(t%Math.max(14,46-nivel*4)===0)spawn();
    for(var i=objs.length-1;i>=0;i--){
      var o=objs[i];o.y+=o.v;o.x+=Math.sin(t*0.02+i)*0.6;
      x.shadowBlur=14;
      if(o.b){x.shadowColor='#ff5f57';x.fillStyle='#ff5f57';}else{x.shadowColor='#ffb84d';x.fillStyle='#ffb84d';}
      x.beginPath();x.arc(o.x,o.y,o.r,0,6.29);x.fill();
      x.shadowBlur=0;x.strokeStyle='rgba(0,0,0,.5)';x.stroke();
      if(o.y>H-46&&Math.abs(o.x-nave.x)<nave.w/2+o.r){
        if(o.b){vidas--;document.getElementById('j1v').textContent=vidas;boom(o.x,o.y);objs.splice(i,1);if(vidas<=0){fin();return;}}
        else{score+=5+nivel*2;document.getElementById('j1s').textContent=score;if(score%25<nivel*5){nivel=1+Math.floor(score/25);document.getElementById('j1l').textContent=nivel;spd=1.2+nivel*0.25;}spark(o.x,o.y);objs.splice(i,1);}
      }else if(o.y>H+30){objs.splice(i,1);}
    }
    for(var p=part.length-1;p>=0;p--){var q=part[p];q.l--;q.x+=q.vx;q.y+=q.vy;x.globalAlpha=q.l/24;x.fillStyle=q.c;x.fillRect(q.x,q.y,3,3);if(q.l<=0)part.splice(p,1);}x.globalAlpha=1;
    dibujarNave();
    requestAnimationFrame(loop);
  }
  function dibujarNave(){
    x.save();x.translate(nave.x,H-46);
    x.shadowColor='#00f0ff';x.shadowBlur=18;
    var g=x.createLinearGradient(0,-22,0,18);g.addColorStop(0,'#00f0ff');g.addColorStop(1,'#bf5af2');
    x.fillStyle=g;
    x.beginPath();x.moveTo(0,-22);x.lineTo(26,14);x.lineTo(14,8);x.lineTo(0,18);x.lineTo(-14,8);x.lineTo(-26,14);x.closePath();x.fill();
    x.shadowBlur=0;x.fillStyle='#eef6ff';
    x.beginPath();x.moveTo(0,-10);x.ellipse(0,0,10,8,0,0,6.29);x.fill();
    var fl=Math.sin(t*0.4)*4;
    x.fillStyle='rgba(255,159,10,.85)';x.beginPath();x.moveTo(-8,14);x.lineTo(0,26+fl);x.lineTo(8,14);x.closePath();x.fill();
    x.restore();
  }
  function spark(cx,cy){for(var i=0;i<10;i++)part.push({x:cx,y:cy,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,l:24,c:'#ffd66b'});}
  function boom(cx,cy){for(var i=0;i<26;i++)part.push({x:cx,y:cy,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,l:30,c:'#ff5f57'});}
  function fin(){
    run=false;if(score>+R.get('miner','0'))R.set('miner',String(score));
    x.clearRect(0,0,W,H);x.fillStyle='rgba(2,2,10,.82)';x.fillRect(0,0,W,H);
    x.fillStyle='#ff5f57';x.font='900 42px Orbitron';x.textAlign='center';x.fillText('NAVE DESTRUIDA',W/2,H/2-20);
    x.fillStyle='#00f0ff';x.font='700 22px Orbitron';x.fillText('TRIN capturados: '+score+' · Récord: '+R.get('miner','0'),W/2,H/2+26);
    x.font='600 16px Inter';x.fillText('Pulsa ENTER para reintentar',W/2,H/2+66);x.textAlign='left';
    var h=function(e){if(e.key==='Enter'){removeEventListener('keydown',h);objs=[];part=[];score=0;vidas=3;nivel=1;spd=1.2;run=true;t=0;document.getElementById('j1s').textContent='0';document.getElementById('j1l').textContent='1';document.getElementById('j1v').textContent='3';document.getElementById('j1r').textContent=R.get('miner','0');loop();}};
    addEventListener('keydown',h);
  }
  loop();
 }
};
</script>

<script>
/* ============ JUEGO 2: COSMOS RUNNER ============ */
var J2={
 html:'<div class="hud"><div><span class="k">DISTANCIA:</span> <span class="v" id="j2s">0</span></div><div><span class="k">WARP:</span> <span class="v" id="j2w">1</span></div><div><span class="k">RÉCORD:</span> <span class="v" id="j2r">0</span></div></div><canvas class="game" id="j2" width="880" height="520"></canvas>',
 inst:'&#8592;&#8594; esquivar escombros &middot; la velocidad aumenta sin parar &middot; un choque acaba la partida',
 start:function(){
  var cv=document.getElementById('j2'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
  var nave={x:W/2},obs=[],dist=0,t=0,run=true,vel=4;
  document.getElementById('j2r').textContent=R.get('runner','0');
  var keys={};addEventListener('keydown',function(e){keys[e.key]=true});addEventListener('keyup',function(e){keys[e.key]=false});
  function spawn(){
    obs.push({x:Math.random()*(W-60)+30,y:-40,w:34+Math.random()*46,h:26+Math.random()*30,v:vel*(0.8+Math.random()*0.7)});
  }
  function loop(){
    if(!run)return;
    t++;x.clearRect(0,0,W,H);nebula(x,W,H,t);stars(x,W,H,t);
    if(keys['ArrowLeft'])nave.x-=8;if(keys['ArrowRight'])nave.x+=8;nave.x=clamp(nave.x,24,W-24);
    dist+=vel/10;vel=4+Math.floor(dist/200)*0.7;
    document.getElementById('j2s').textContent=Math.floor(dist);
    document.getElementById('j2w').textContent=(1+Math.floor(dist/200));
    if(t%Math.max(12,52-Math.floor(dist/120))===0)spawn();
    x.strokeStyle='rgba(0,240,255,.25)';x.lineWidth=2;
    for(var g=-60;g<H+60;g+=70){var off=(t*vel*2)%70;x.beginPath();x.moveTo(0,g+off);x.lineTo(W,g+off-70);x.stroke();}
    for(var i=obs.length-1;i>=0;i--){
      var o=obs[i];o.y+=o.v;
      x.shadowColor='#bf5af2';x.shadowBlur=12;x.fillStyle='#7a3bb8';
      x.beginPath();
      x.moveTo(o.x,o.y);x.lineTo(o.x+o.w,o.y);x.lineTo(o.x+o.w*0.7,o.y+o.h);x.lineTo(o.x+o.w*0.3,o.y+o.h);
      x.closePath();x.fill();x.shadowBlur=0;
      x.strokeStyle='rgba(255,255,255,.25)';x.stroke();
      if(o.y+o.h>H-60&&o.y<H-20&&Math.abs(o.x+o.w/2-nave.x)<(o.w/2+16)){fin();return;}
      if(o.y>H+50)obs.splice(i,1);
    }
    dibujarNave();
    requestAnimationFrame(loop);
  }
  function dibujarNave(){
    x.save();x.translate(nave.x,H-52);
    x.shadowColor='#00f0ff';x.shadowBlur=16;
    x.fillStyle='#0ae0ff';
    x.beginPath();x.moveTo(0,-18);x.lineTo(16,12);x.lineTo(0,6);x.lineTo(-16,12);x.closePath();x.fill();
    var fl=Math.sin(t*0.5)*5;
    x.shadowBlur=8;x.fillStyle='rgba(255,159,10,.9)';
    x.beginPath();x.moveTo(-6,8);x.lineTo(0,22+fl);x.lineTo(6,8);x.closePath();x.fill();
    x.restore();
  }
  function fin(){
    run=false;if(dist>+R.get('runner','0'))R.set('runner',String(Math.floor(dist)));
    x.fillStyle='rgba(2,2,10,.82)';x.fillRect(0,0,W,H);
    x.fillStyle='#bf5af2';x.font='900 42px Orbitron';x.textAlign='center';x.fillText('COLISION',W/2,H/2-20);
    x.fillStyle='#00f0ff';x.font='700 22px Orbitron';x.fillText('Distancia: '+Math.floor(dist)+' · Récord: '+R.get('runner','0'),W/2,H/2+26);
    x.font='600 16px Inter';x.fillText('Pulsa ENTER para reintentar',W/2,H/2+66);x.textAlign='left';
    var h=function(e){if(e.key==='Enter'){removeEventListener('keydown',h);obs=[];dist=0;vel=4;t=0;run=true;loop();}};
    addEventListener('keydown',h);
  }
  loop();
 }
};
</script>

<script>
/* ============ JUEGO 3: QUIZ DEL BATALLON ============ */
var QUIZ=[
 ["¿Quiénes son la autoridad máxima del TVS?","Los inversores","Pedro Costa y Trinnity Hurtado","El consejo de agentes","OpenAI",1],
 ["¿Cuántas mentes aspira a conectar el TVS?","500","5.000+","50.000","1 millón",1],
 ["¿Qué es la Prueba de Mandato (PoM)?","Un test de seguridad","Prueba de mandato de los agentes AIOX con VSR","Un certificado ISO","Un juego",1],
 ["¿Cuál es el supply total de VSR?","300.000.000","30.000.000","3.000.000.000","420.690.000",0],
 ["¿Cuál es el supply de TRIN?","300.000.000","1.000.000.000","420.690.000","69.420.000",2],
 ["¿Qué hace TRIN en cada transacción?","Nada","Reparte a holders","Quema el 2%","Mina más tokens",2],
 ["¿Cuántos agentes tiene la escuadra AIOX?","6","8","12","24",2],
 ["¿Qué generan las misiones al completarse?","USD","VSR","TRIN","Créditos de nube",2],
 ["¿En qué 3 redes operan VSR y TRIN?","ETH, BSC, Solana","BTC, ETH, ADA","Polygon, AVAX, FTM","Solo ETH",0],
 ["¿Qué es OmniRoute en el TVS?","Un router WiFi","El enrutador multi-LLM del sistema","Una carretera","Un token",1]
];
var J3={
 html:'<div class="qbox" id="j3box"></div>',
 inst:'10 preguntas sobre el universo TVS &middot; cada acierto suma 10 TRIN virtuales &middot; 7+ aciertos = Mente del Batallón',
 start:function(){
  var box=document.getElementById('j3box'),idx=0,aciertos=0;
  function pintar(){
    if(idx>=QUIZ.length){
      var premio=aciertos*10;box.innerHTML='<div class="final"><div style="font-size:2.5rem">'+(aciertos>=7?'&#129302;':'&#128125;')+'</div>'+
        '<div class="big">'+aciertos+'/10</div>'+
        '<div style="color:var(--muted)">'+(aciertos>=7?'Rango: MENTE DEL BATALLON':'Rango: recluta espacial')+'</div>'+
        '<div class="trin" style="margin-top:12px">+'+premio+' TRIN virtuales</div>'+
        '<button class="opt" style="text-align:center;margin-top:18px" onclick="J3.start()">REINTENTAR QUIZ</button></div>';
      return;
    }
    var q=QUIZ[idx];
    var h='<div class="q">Pregunta '+(idx+1)+'/10 &middot; '+q[0]+'</div>';
    var orden=[0,1,2,3];orden.sort(function(){return Math.random()-0.5});
    orden.forEach(function(oi){
      h+='<button class="opt" data-i="'+oi+'">'+q[oi+1]+'</button>';
    });
    box.innerHTML=h;
    box.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){
        var i=+b.dataset.i;
        var correcta=i===q[5];
        if(correcta){b.classList.add('good');aciertos++;}
        else{b.classList.add('bad');box.querySelector('.opt[data-i="'+q[5]+'"]').classList.add('good');}
        box.querySelectorAll('.opt').forEach(function(x){x.style.pointerEvents='none'});
        setTimeout(function(){idx++;pintar()},900);
      };
    });
  }
  pintar();
 }
};
/* ============ INIT ============ */
var JUEGOS={minero:J1,runner:J2,quiz:J3};
var panel=document.getElementById('panel'),inst=document.getElementById('inst');
function cargarJuego(id){
  document.querySelectorAll('.menu button').forEach(function(b){b.classList.remove('on')});
  document.getElementById('b-'+id).classList.add('on');
  var j=JUEGOS[id];
  panel.innerHTML=j.html;
  inst.textContent=j.inst;
  j.start();
}
var inicial=new URLSearchParams(location.search).get('j');
cargarJuego(JUEGOS[inicial]?inicial:'minero');
document.getElementById('b-minero').onclick=function(){cargarJuego('minero')};
document.getElementById('b-runner').onclick=function(){cargarJuego('runner')};
document.getElementById('b-quiz').onclick=function(){cargarJuego('quiz')};
</script>
</body>
</html>
